  y+=4.5; doc.setFont("helvetica","normal"); doc.setFontSize(8); doc.setTextColor(30,40,36);
  const nm=doc.splitTextToSize(D.s.nama||"",50), kl=doc.splitTextToSize(D.progs.join(", ")||"-",26);
  doc.text(D.s.noInduk||"-",cols[0],y); doc.setFont("helvetica","bold"); doc.text(nm,cols[1],y); doc.setFont("helvetica","normal"); doc.text(kl,cols[2],y); doc.text(D.s.tglMasuk||"-",cols[3],y);
  y+=Math.max(nm.length,kl.length)*3.6+5;
  doc.setFillColor(243,245,242); doc.rect(M,y-4,W-2*M,6.5,"F"); doc.setFont("helvetica","bold"); doc.setFontSize(6.8); doc.setTextColor(...mute);
  doc.text("KETERANGAN",M+2,y); doc.text("QTY",M+78,y,{align:"right"}); doc.text("HARGA",M+100,y,{align:"right"}); doc.text("JUMLAH",W-M-2,y,{align:"right"});
  y+=7; doc.setFont("helvetica","normal"); doc.setFontSize(8); doc.setTextColor(30,40,36); doc.setDrawColor(219,226,221); doc.setLineWidth(0.2);
  D.items.forEach(i=>{ const t=doc.splitTextToSize(i.ket,70); doc.text(t,M+2,y); doc.text(String(i.qty),M+78,y,{align:"right"}); doc.text(rp(i.harga),M+100,y,{align:"right"}); doc.text(rp(i.harga*i.qty),W-M-2,y,{align:"right"}); y+=t.length*3.6+2.4; doc.line(M,y-3.2,W-M,y-3.2); });
  y+=1; doc.setDrawColor(...ink); doc.setLineWidth(0.6); doc.line(M+60,y-3,W-M,y-3);
  doc.setFont("helvetica","bold"); doc.setFontSize(9.5); doc.setTextColor(...ink); doc.text(inv?"TOTAL":"TOTAL DITERIMA",M+100,y+2,{align:"right"}); doc.text(rp(D.total),W-M-2,y+2,{align:"right"}); y+=9;
  if(!inv){ doc.setFillColor(251,240,214); const tb=doc.splitTextToSize("Terbilang: "+terbilang(D.total),W-2*M-6); doc.rect(M,y-4,W-2*M,tb.length*3.8+3.5,"F"); doc.setFont("helvetica","italic"); doc.setFontSize(8); doc.setTextColor(60,60,50); doc.text(tb,M+3,y); y+=tb.length*3.8+6; }
  doc.setFont("helvetica","bold"); doc.setFontSize(8); doc.setTextColor(30,40,36);
  if(inv){ doc.text("Pembayaran via transfer bank",M,y); doc.setFont("helvetica","normal"); doc.text(L.bank+" "+L.rekening,M,y+4); doc.text("a.n. "+L.atasNama,M,y+8); doc.setTextColor(...red); doc.text("Mohon dibayar paling lambat "+fmtDate(D.jatuhTempo),M,y+12); }
  else { doc.text("Diterima dari: ",M,y); doc.setFont("helvetica","normal"); doc.text(D.s.nama||"",M+21,y); doc.text("Metode: "+(D.metode||"-"),M,y+4); if(D.sisa>0){ doc.setTextColor(...red); doc.text("Sisa tagihan "+rp(D.sisa),M,y+8);} }
  const stamp = inv ? (D.status==="lunas"?["LUNAS",green]:D.status==="sebagian"?["KURANG "+rp(D.sisa),red]:null) : (D.sisa>0?["SEBAGIAN",red]:["LUNAS",green]);

  y=Math.max(y+20,170); doc.setDrawColor(219,226,221); doc.setLineWidth(0.2); doc.line(M,y,W-M,y);

/* ---------- rekap absensi per siswa ---------- */
const ABS_LABEL={H:"Hadir",I:"Izin",G:"Ganti jadwal",A:"Alpa/hangus"};
const ABS_COLOR={H:"var(--good)",I:"var(--info)",G:"var(--warn)",A:"var(--bad)"};
function attendanceOf(key){
  const rows=[];
  state.absensi.forEach(rec=>{ Object.entries(rec.tanda||{}).forEach(([jid,v])=>{
    const j=byId("jadwal",jid); const sid=(rec.siswa||{})[jid] || (j&&j.siswaId); const s=byId("siswa",sid);
    if(v && s && personKey(s)===key) rows.push({tanggal:rec.tanggal||rec.id, jid, v, s, j, note:(rec.catatan||{})[jid]||""});
  }); });
  return rows.sort(byText(r=>r.tanggal+(r.j?r.j.mulai:""))).reverse();
}
const countOf = rows => { const c={H:0,I:0,G:0,A:0}; rows.forEach(r=>{ if(c[r.v]!==undefined) c[r.v]++; }); c.total=rows.length; c.pct=c.total?Math.round(c.H/c.total*100):0; return c; };
const stackBar = c => c.total ? `<div class="rk-bar" title="Hadir ${c.H}, izin ${c.I}, ganti ${c.G}, alpa ${c.A}">${["H","I","G","A"].map(k=>c[k]?`<i style="width:${c[k]/c.total*100}%;background:${ABS_COLOR[k]}"></i>`:"").join("")}</div>` : `<div class="rk-bar"></div>`;
function rekapText(name, mlabel, c, rows){
  return `*Rekap kehadiran ${name}*\n${mlabel}\n\nHadir: ${c.H}\nIzin: ${c.I}\nGanti jadwal: ${c.G}\nAlpa/hangus: ${c.A}\nKehadiran: ${c.pct}% dari ${c.total} pertemuan\n\n`+rows.slice().reverse().map(r=>`• ${fmtDate(r.tanggal)} ${r.j?r.j.mulai:""} ${kelasLabel(r.s)}: ${ABS_LABEL[r.v]||r.v}`).join("\n")+(rows.some(r=>r.note)?"\n\nCatatan instruktur:\n"+rows.slice().reverse().filter(r=>r.note).map(r=>`• ${fmtDate(r.tanggal)}: ${r.note}`).join("\n"):"")+`\n\n— ${lembaga().nama}`;
}

  const sched=state.jadwal.filter(j=>ens.some(s=>s.id===j.siswaId)).sort(byText(j=>HARI.indexOf(j.hari)+j.mulai)).map(j=>`${j.hari} ${j.mulai} (R.${j.ruang})`).join(", ");
  const root=$("#modalRoot");

    <div class="rk-sum"><div><b class="num">${cAll.total}</b><span>Total pertemuan tercatat</span></div><div><b class="num" style="color:var(--good)">${cAll.pct}%</b><span>Kehadiran keseluruhan</span></div><div><b class="num">${cSel.H}/${cSel.total}</b><span>Hadir ${fmtMonth(sel)}</span></div><div><b class="num" style="color:var(--bad)">${cAll.A}</b><span>Alpa/hangus total</span></div></div>
    <section class="panel"><div class="panel-h"><h2>Per bulan</h2><div class="rk-legend">${["H","I","G","A"].map(k=>`<span><i style="background:${ABS_COLOR[k]}"></i>${ABS_LABEL[k]}</span>`).join("")}</div></div>
      <div class="table-wrap"><table><thead><tr><th>Bulan</th><th class="r">H</th><th class="r">I</th><th class="r">G</th><th class="r">A</th><th class="r">Hadir</th><th class="hide-sm" style="width:30%"></th></tr></thead><tbody>

    <section class="panel"><div class="panel-h"><h2>${fmtMonth(sel)}</h2><span class="note">${cSel.total} pertemuan</span></div><div class="panel-b">

      :`<div class="empty" style="padding:18px 0"><strong>Belum ada absensi tercatat</strong><span>Absensi bulan ini muncul setelah diisi di menu Absensi.</span></div>`}

    <div class="doc-actions"><button class="btn" type="button" id="rkCopy">Salin rekap</button>${wa&&selRows.length&&ROLE!=="instruktur"?`<a class="btn wa" href="https://wa.me/${wa}?text=${encodeURIComponent(rekapText(main.nama,fmtMonth(sel),cSel,selRows))}" target="_blank" rel="noopener">Kirim rekap ke WA</a>`:""}${ROLE!=="instruktur"?`<button class="btn" type="button" id="rkEdit">Ubah data siswa</button>`:""}</div>
  </div></div></div>`;
  const close=()=>{root.innerHTML="";document.removeEventListener("keydown",onKey);}; const onKey=e=>{if(e.key==="Escape")close();};
  document.addEventListener("keydown",onKey); $("#rkClose").onclick=close; $("#scrim").addEventListener("mousedown",e=>{if(e.target.id==="scrim")close();});
  root.querySelectorAll("[data-rkm]").forEach(tr=>{ const go=()=>{ document.removeEventListener("keydown",onKey); openRekap(key,tr.dataset.rkm); }; tr.addEventListener("click",go); tr.addEventListener("keydown",e=>{ if(e.key==="Enter"||e.key===" "){ e.preventDefault(); go(); } }); });
  $("#rkCopy").onclick=async()=>{ try{ await navigator.clipboard.writeText(rekapText(main.nama,fmtMonth(sel),cSel,selRows)); toast("Rekap disalin"); }catch(_){ toast("Tidak bisa menyalin otomatis di tampilan ini"); } };
  const rke=$("#rkEdit"); if(rke) rke.onclick=()=>{ close(); formSiswa(main); };
  $("#rkNote").onclick=()=>{ close(); formCatatan(null,{siswaId:main.id,instrukturId:main.instrukturId||""}); };
}

function noteStamp(n){
  if(!n||!n.dibuat) return "";
  const din=isoOf(new Date(n.dibuat)); const tl=n.tanggal?Math.round((new Date(din+"T00:00:00")-new Date(n.tanggal+"T00:00:00"))/864e5):0;

/* ---------- PDF catatan les dari instruktur ---------- */
function catatanPdf(n, jsPDF){
  const s=byId("siswa",n.siswaId)||{}, ins=insOf(n.instrukturId), L=lembaga();
  const doc=new jsPDF({unit:"mm",format:"a5"}); const W=148, M=12; let y=16;
  const ink=[22,54,46], mute=[95,112,104], body=[30,40,36];
  const need=h=>{ if(y+h>198){ doc.addPage(); y=16; } };
  const para=(txt,size=9,style="normal",color=body)=>{ doc.setFont("helvetica",style); doc.setFontSize(size); doc.setTextColor(...color); doc.splitTextToSize(String(txt),W-2*M).forEach(ln=>{ need(size*0.45); doc.text(ln,M,y); y+=size*0.45; }); y+=1.2; };
  try{ doc.addImage(LOGO,"PNG",M,y-5,13,13); }catch(_){}
  doc.setFont("helvetica","bold"); doc.setFontSize(11.5); doc.setTextColor(...ink); doc.text(L.nama.toUpperCase(),M+16,y);
  doc.setFont("helvetica","normal"); doc.setFontSize(7.3); doc.setTextColor(...mute); (L.alamat+"\n"+L.telepon).split("\n").forEach((ln,i)=>doc.text(ln.trim(),M+16,y+4.6+i*3.4));
  doc.setFont("helvetica","bold"); doc.setFontSize(13); doc.setTextColor(...ink); doc.text("CATATAN LES",W-M,y,{align:"right"});
  doc.setFont("helvetica","normal"); doc.setFontSize(8); doc.setTextColor(...mute); doc.text(dayName(n.tanggal)+", "+fmtDate(n.tanggal),W-M,y+5,{align:"right"});
  y+=17; doc.setDrawColor(...ink); doc.setLineWidth(0.7); doc.line(M,y,W-M,y); y+=6;
  para(s.nama||"Siswa",11.5,"bold",ink);
  para(`${s.noInduk?"No. Induk "+s.noInduk+" · ":""}${s.nama?kelasLabel(s):""}${ins?" · Instruktur: "+ins.nama:""}`,8.3,"normal",mute); y+=2;
  const sec=(t,v)=>{ if(!v) return; need(10); para(t.toUpperCase(),7.3,"bold",mute); para(v,9.5); y+=1.5; };
  sec("Materi yang dipelajari",n.materi); sec("Perkembangan",n.level?levelLabel(n.level):""); sec("Catatan untuk siswa & orang tua",n.catatan); sec("Latihan di rumah",n.latihan);
  y=Math.max(y+4,182); need(12); doc.setDrawColor(219,226,221); doc.setLineWidth(0.2); doc.line(M,y,W-M,y); y+=4.5;
  para("Kritik dan saran silakan hubungi "+L.kontakSaran,7.2,"normal",mute); para(L.penutup,7.2,"italic",mute);
  return doc;
}
async function saveCatatanPdf(n){
  if(!n) return;
  try{ const dl=await getDownloads(); if(!dl){ toast("Unduhan PDF tidak tersedia di tampilan ini. Pesan WhatsApp tetap berisi catatan lengkap."); return; }
    const jsPDF=await loadJsPDF(); const s=byId("siswa",n.siswaId)||{};

/* ---------- rekap bulanan: kehadiran + catatan akhir bulan ---------- */
const raporId = (sid,m) => "bln_"+sid+"_"+m;
const raporOf = (sid,m) => { const n=byId("catatan",raporId(sid,m)); return n&&(n.ringkasan||n.target||n.materi)?n:null; };
const raporMonth = () => new Date().getDate()<=7 ? isoAdd(thisMonth()+"-01",-1).slice(0,7) : thisMonth();
const lastDayOf = m => { const [y,mm]=m.split("-").map(Number); return m+"-"+pad(new Date(y,mm,0).getDate()); };
const shortDate = iso => { const d=new Date(iso+"T00:00:00"); return d.getDate()+" "+BULAN[d.getMonth()].slice(0,3); };
function buildRapor(key, m){
  const ens=state.siswa.filter(s=>personKey(s)===key); if(!ens.length) return null;
  const main=ens.find(s=>s.status==="aktif")||ens[0];
  const rows=attendanceOf(key).filter(r=>r.tanggal.slice(0,7)===m).reverse();
  const kelas=ens.filter(s=>s.status==="aktif"||rows.some(r=>r.s.id===s.id)).map(s=>{ const rr=rows.filter(r=>r.s.id===s.id);
    const harian=state.catatan.filter(n=>!isBulanan(n)&&n.siswaId===s.id&&(n.tanggal||"").startsWith(m)).sort(byText(n=>n.tanggal));
    return {s, ins:insOf(s.instrukturId), c:countOf(rr), rows:rr, bulanan:raporOf(s.id,m), harian}; });
  const mark=byId("catatan",raporId(main.id,m));
  return {key, m, main, rows, c:countOf(rows), kelas, kirimAt:(mark&&mark.kirimAt)||"", nCat:kelas.filter(k=>k.bulanan).length};
}
function rekapList(m){
  const keys=new Set(state.siswa.filter(s=>s.status==="aktif").map(personKey));
  state.absensi.forEach(rec=>{ if(!String(rec.tanggal||rec.id).startsWith(m)) return; Object.entries(rec.tanda||{}).forEach(([jid,v])=>{ const j=byId("jadwal",jid); const s=byId("siswa",(rec.siswa||{})[jid]||(j&&j.siswaId)); if(v&&s) keys.add(personKey(s)); }); });
  return [...keys].map(k=>buildRapor(k,m)).filter(R=>R&&R.kelas.length).sort(byText(R=>R.main.nama));
}
function raporText(R){

function raporPdf(R, jsPDF){
  const doc=new jsPDF({unit:"mm",format:"a4"}); const W=210, M=16, L=lembaga(); let y=18;
  const ink=[22,54,46], mute=[95,112,104], body=[30,40,36];
  const need=h=>{ if(y+h>282){ doc.addPage(); y=18; } };
  const para=(txt,size=9.5,style="normal",color=body,indent=0)=>{ doc.setFont("helvetica",style); doc.setFontSize(size); doc.setTextColor(...color); const t=doc.splitTextToSize(String(txt),W-2*M-indent); t.forEach(ln=>{ need(size*0.45); doc.text(ln,M+indent,y); y+=size*0.45; }); y+=1.2; };
  try{ doc.addImage(LOGO,"PNG",M,y-6,14,14); }catch(_){}
  doc.setFont("helvetica","bold"); doc.setFontSize(13); doc.setTextColor(...ink); doc.text(L.nama.toUpperCase(),M+18,y);
  doc.setFont("helvetica","normal"); doc.setFontSize(8); doc.setTextColor(...mute); (L.alamat+"\n"+L.telepon).split("\n").forEach((ln,i)=>doc.text(ln.trim(),M+18,y+5+i*3.8));
  doc.setFont("helvetica","bold"); doc.setFontSize(16); doc.setTextColor(...ink); doc.text("REKAP BULANAN",W-M,y,{align:"right"}); doc.setFont("helvetica","normal"); doc.setFontSize(9); doc.setTextColor(...mute); doc.text(fmtMonth(R.m),W-M,y+6,{align:"right"});
  y+=18; doc.setDrawColor(...ink); doc.setLineWidth(0.8); doc.line(M,y,W-M,y); y+=7;
  para(`${R.main.nama}`,12,"bold",ink); para(`No. Induk ${R.main.noInduk||"-"} · ${R.kelas.map(k=>kelasLabel(k.s)).join(", ")}`,9,"normal",mute);
  y+=2; para("KEHADIRAN",9,"bold",ink);
  const bx=(W-2*M-9)/4; [["Hadir",R.c.H],["Izin",R.c.I],["Ganti jadwal",R.c.G],["Alpa/hangus",R.c.A]].forEach(([l,v],i)=>{ const x=M+i*(bx+3); doc.setFillColor(243,245,242); doc.roundedRect(x,y-1,bx,13,1.5,1.5,"F"); doc.setFont("helvetica","bold"); doc.setFontSize(13); doc.setTextColor(...ink); doc.text(String(v),x+4,y+6); doc.setFont("helvetica","normal"); doc.setFontSize(7.5); doc.setTextColor(...mute); doc.text(l,x+4,y+10.2); });
  y+=17; para(R.c.total?`Kehadiran ${R.c.pct}% dari ${R.c.total} pertemuan tercatat.`:"Belum ada absensi tercatat bulan ini.",9.5);
  R.kelas.forEach(k=>{ y+=3; need(14); doc.setDrawColor(219,226,221); doc.setLineWidth(0.3); doc.line(M,y-1,W-M,y-1); y+=4;
    para(`${kelasLabel(k.s)}${k.ins?" · "+k.ins.nama:""}`.toUpperCase(),9,"bold",ink);
    para(k.rows.length?`Hadir ${k.c.H} dari ${k.c.total} pertemuan: ${k.rows.map(r=>shortDate(r.tanggal)+" ("+(ABS_LABEL[r.v]||r.v)+")").join(", ")}`:"Belum ada absensi kelas ini.",9);
    const b=k.bulanan; const it=(t,v)=>{ if(!v) return; para(t,7.5,"bold",mute); para(v,9.5); };
    if(b){ it("PERKEMBANGAN",b.level?levelLabel(b.level):""); it("CATATAN INSTRUKTUR",b.ringkasan); it("MATERI BULAN INI",b.materi); it("TARGET BULAN DEPAN",b.target); it("LATIHAN DI RUMAH",b.latihan); }
    else { const mt=[...new Set(k.harian.map(n=>n.materi).filter(Boolean))].join("; "); it("MATERI BULAN INI",mt); }
  });
  y+=4; need(14); doc.setDrawColor(219,226,221); doc.line(M,y,W-M,y); y+=5;
  para("Kritik dan saran silakan hubungi "+L.kontakSaran,8,"normal",mute); para(L.penutup,8,"italic",mute);
  return doc;
}

async function saveRaporPdf(R, note){
  try{ const dl=await getDownloads(); if(!dl){ note&&note("Unduhan PDF tidak tersedia di tampilan ini. Pesan WhatsApp tetap berisi rekap lengkap."); return; }
    const jsPDF=await loadJsPDF(); const pdf=raporPdf(R,jsPDF);
    await dl.save({filename:`Rekap Sabda Reswara - ${R.main.nama.replace(/[\\/:*?"<>|]/g,"")} - ${fmtMonth(R.m)}.pdf`,data:pdf.output("blob")}); toast("PDF rekap disimpan");
  }catch(e){ const c=e&&e.code; if(c==="declined") return; const msg=e&&e.message==="load"?"Gagal memuat pembuat PDF. Periksa koneksi lalu coba lagi.":"PDF gagal dibuat. Coba lagi."; note?note(msg):toast(msg); }
}

const isoOf = d => d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
function weekDays(off){ const d=new Date(todayISO()+"T00:00:00"); d.setDate(d.getDate()-((d.getDay()+6)%7)+off*7); return Array.from({length:7},(_,i)=>{ const x=new Date(d); x.setDate(d.getDate()+i); return isoOf(x); }); }
const myJadwal = (insId, dn) => state.jadwal.filter(j=>(!dn||j.hari===dn) && (slotIns(j)||{}).id===insId).sort(byText(j=>HARI.indexOf(j.hari)+"|"+j.mulai+j.ruang));
function insWeek(insId, off){
  const t=todayISO();
  const rows=weekDays(off).map(tgl=>{ const dn=dayName(tgl); const js=myJadwal(insId,dn); const rec=byId("absensi",tgl)||{}; const tanda=rec.tanda||{}, oleh=rec.oleh||{};
    const diisi=js.filter(j=>insMarkOf(rec,j.id)).length; const byMe=Object.keys(oleh).some(k=>oleh[k]===insId);
    const ci=byId("hadirIns",insId+"_"+tgl);
    return {tgl, dn, jadwal:js.length, diisi, hadir:!!ci||byMe, jam:ci?ci.jam:"", lewat:tgl<=t}; });
  return {rows, hadir:rows.filter(r=>r.hadir).length, terjadwal:rows.filter(r=>r.jadwal>0).length, sesi:rows.reduce((a,r)=>a+r.jadwal,0), sesiDiisi:rows.reduce((a,r)=>a+r.diisi,0)};
}
function gajiOf(i){ const ss=state.siswa.filter(s=>s.instrukturId===(i&&i.id)&&s.status==="aktif"); const spp=ss.reduce((a,b)=>a+(+b.tarif||0),0); const pct=i&&i.persen!==undefined&&i.persen!==""?+i.persen:50; return {ss, spp, pct, gaji:Math.round(spp*pct/100)}; }

/* ---------- catatan absensi → admin → WA orang tua ---------- */
/* Kehadiran: "tanda" = input admin (resmi, dipakai rekap & fee); "tandaIns" = input instruktur.
   Valid bila keduanya sama. Data lama (sebelum fitur ini) yang diisi instruktur dianggap sudah sama. */
function insMarkOf(rec, jid){ const ti=rec.tandaIns||{}; if(Object.prototype.hasOwnProperty.call(ti,jid)) return ti[jid]||""; return (rec.oleh||{})[jid]?((rec.tanda||{})[jid]||""):""; }
const ST_PILL = E => E.st==="valid"?`<span class="pill good">✓ Valid</span>`
  : E.st==="selisih"?`<span class="pill bad">✗ Tidak valid · instruktur ${esc(ABS_LABEL[E.vi]||E.vi)}, admin ${esc(ABS_LABEL[E.va]||E.va)}</span>`
  : E.st==="menunggu"?`<span class="pill warn">Instruktur: ${esc(ABS_LABEL[E.vi]||E.vi)} · menunggu admin</span>` : "";
function absEntry(tgl, jid){
  const rec=byId("absensi",tgl)||{}; const j=byId("jadwal",jid); const s=byId("siswa",(rec.siswa||{})[jid]||(j&&j.siswaId));
  const ins=insOf((rec.oleh||{})[jid])||(j&&slotIns(j));
  const vi=insMarkOf(rec,jid), va=(rec.tanda||{})[jid]||"";
  const st=vi&&va?(vi===va?"valid":"selisih"):vi?"menunggu":va?"admin":"";
  return {rec, j, s, ins, vi, va, st, v:va||vi, ket:(rec.ketAdm||{})[jid]||"", admBy:(rec.admBy||{})[jid]||"", admAt:(rec.admAt||{})[jid]||"", note:(rec.catatan||{})[jid]||"", waktu:(rec.waktu||{})[jid]||"", oleh:(rec.oleh||{})[jid]||"", waAt:(rec.waAt||{})[jid]||""};
}
const hm = iso => { if(!iso) return ""; const d=new Date(iso); return isNaN(d)?"":pad(d.getHours())+":"+pad(d.getMinutes()); };

      if(E.va&&E.va!=="H") out.push({tgl,j,E,kind:E.va,label:ABS_LABEL[E.va]||E.va,ket:E.ket,by:E.admBy,at:E.admAt,ganti:rc.ov&&rc.status==="pindah"?rcLabel(rc):""});
      else if(rc.ov&&(rc.status==="pindah"||rc.status==="libur")) out.push({tgl,j,E,kind:rc.status,label:rc.status==="pindah"?"Pindah jadwal":"Diliburkan",ket:rc.ov.catatan||"",by:rc.ov.oleh,at:rc.ov.diubah,ganti:rc.status==="pindah"?rcLabel(rc):""});

let notifPerm = "", notifSig = "", ingatTimer = null;
const INGAT_MENIT = 5;

function sesiAkhir(tgl, j){ return new Date(tgl+"T"+toHM(toMin(j.selesai)-INGAT_MENIT)+":00"); }
function ingatList(days){
  if(!ME.instrukturId) return []; const now=Date.now(), out=[];
  for(let i=0;i<days;i++){ const tgl=isoAdd(todayISO(),i); myJadwal(ME.instrukturId, dayName(tgl)).forEach(j=>{ const at=sesiAkhir(tgl,j).getTime(); if(at<=now+30000||sesiLibur(j,tgl)) return;
    const s=byId("siswa",j.siswaId); const nm=slotName(j);
    out.push({at, title:`⏰ ${INGAT_MENIT} menit lagi: ${nm}${s?" ("+(progOf(s)?progOf(s).nama:kelasLabel(s))+")":""}`, body:`Sesi berakhir pukul ${jm(j.selesai)} di Ruang ${j.ruang}. Berikan resume pertemuan kepada siswa, lalu tulis di catatan siswa.`, extra:{jid:j.id, tgl}}); }); }
  return out.sort((a,b)=>a.at-b.at).slice(0,60);
}

/* ---------- siswa cuti: follow-up minggu ke-4 & hapus otomatis setelah 3 bulan ---------- */
const CUTI_BULAN = 3;
const mingguKe4 = (d=new Date()) => d.getDate()>=22 && d.getDate()<=28;
const addMonths = (iso,n) => { const d=new Date(iso+"T00:00:00"); const day=d.getDate(); d.setDate(1); d.setMonth(d.getMonth()+n); d.setDate(Math.min(day,new Date(d.getFullYear(),d.getMonth()+1,0).getDate())); return isoOf(d); };
const hapusPada = s => s.cutiSejak ? addMonths(s.cutiSejak, CUTI_BULAN) : "";
const lamaCuti = s => { if(!s.cutiSejak) return ""; const n=Math.round((new Date(todayISO()+"T00:00:00")-new Date(s.cutiSejak+"T00:00:00"))/864e5); return n<31?`${n} hari`:`${Math.floor(n/30)} bulan ${n%30?(n%30)+" hari":""}`.trim(); };
function cutiPatch(old, status){
  if(status==="cuti") return old.status==="cuti"&&old.cutiSejak ? {cutiSejak:old.cutiSejak} : {cutiSejak:todayISO()};
  return {cutiSejak:undefined};
}
let cutiDone=false;
async function arsipkan(s){ const doc={...s, id:"arsip_"+s.id+"_"+todayISO(), siswaId:s.id, dihapusPada:new Date().toISOString(), alasan:`Cuti ${CUTI_BULAN} bulan berturut-turut sejak ${s.cutiSejak}`};
  if(backend==="db"){ try{ await db.collection("arsip").doc(doc.id).set(JSON.parse(JSON.stringify(doc))); return true; }catch(e){ console.warn("arsip",e); return false; } } return true; }
async function cutiHousekeeping(){
  if(cutiDone||ROLE==="instruktur"||!canWrite||backend==="memuat"||!loaded.siswa) return; cutiDone=true;
  const t=todayISO();
  for(const s of state.siswa.filter(x=>x.status==="cuti"&&!x.cutiSejak)) await Store.merge("siswa",s.id,{cutiSejak:thisMonth()+"-01"}).catch(()=>{});
  for(const s of state.siswa.filter(x=>x.status!=="cuti"&&x.cutiSejak)) await Store.merge("siswa",s.id,{cutiSejak:null}).catch(()=>{});
  const habis=state.siswa.filter(x=>x.status==="cuti"&&x.cutiSejak&&hapusPada(x)<=t);
  let n=0; for(const s0 of habis){ const s=byId("siswa",s0.id); if(!s||s.status!=="cuti"||!s.cutiSejak||hapusPada(s)>t) continue; if(await arsipkan(s)){ try{ await Store.del("siswa",s.id); n++; }catch(_){} } }
  if(n) toast(`${n} kelas les siswa cuti ${CUTI_BULAN} bulan berturut-turut dihapus otomatis (salinan disimpan di arsip).`);
}
function cutiGroups(){
  const m=thisMonth(), g=new Map();
  state.siswa.filter(s=>s.status==="cuti").forEach(s=>{ const k=personKey(s); if(!g.has(k)) g.set(k,[]); g.get(k).push(s); });
  return [...g.entries()].map(([key,ens])=>{ const main=ens[0]; const sejak=ens.map(x=>x.cutiSejak||"").filter(Boolean).sort()[0]||"";
    const fu=ens.map(x=>(x.followup||{})[m]).find(Boolean)||null; const hapus=ens.map(hapusPada).filter(Boolean).sort()[0]||"";
    const aktifLain=state.siswa.filter(x=>personKey(x)===key&&x.status==="aktif");
    return {key, ens, main, sejak, fu, hapus, aktifLain}; }).sort(byText(G=>G.hapus+G.main.nama));
}
function fuText(G){

const fuHref = G => { const n=waNumber(G.main.wali); return n?`https://wa.me/${n}?text=${encodeURIComponent(fuText(G))}`:""; };
async function fuMark(G, patch){ const m=thisMonth(); for(const s of G.ens){ const cur=(s.followup||{})[m]||{}; await Store.merge("siswa",s.id,{followup:{[m]:{...cur,...patch,oleh:senderName()}}}).catch(()=>{}); } }

function fotoKeJpeg(file, max, kotak, q){
  return new Promise((res,rej)=>{ const img=new Image(); const u=URL.createObjectURL(file);
    img.onload=()=>{ let sw=img.naturalWidth, sh=img.naturalHeight, sx=0, sy=0;
      if(kotak){ const m=Math.min(sw,sh); sx=(sw-m)/2; sy=(sh-m)/2; sw=sh=m; }
      const sc=Math.min(1,max/Math.max(sw,sh)), w=Math.round(sw*sc), h=Math.round(sh*sc);
      const c=document.createElement("canvas"); c.width=w; c.height=h; const x=c.getContext("2d"); x.imageSmoothingQuality="high"; x.drawImage(img,sx,sy,sw,sh,0,0,w,h);
      URL.revokeObjectURL(u); res({data:c.toDataURL("image/jpeg",q||0.85),w,h}); };
    img.onerror=()=>{ URL.revokeObjectURL(u); rej(new Error("Foto tidak bisa dibaca")); }; img.src=u; });
}

const IG_API = "https://graph.instagram.com/v21.0";
const igCfg = () => byId("rahasia","instagram")||{};
async function igGet(url){ const r=window.RA_http?await window.RA_http(url):await (await fetch(url)).json(); if(r&&r.error) throw new Error(r.error.message||"Instagram menolak permintaan"); return r; }
function igSkor(m){ const age=Math.max(0,(Date.now()-new Date(m.timestamp).getTime())/864e5); return ((+m.like_count||0)+3*(+m.comments_count||0)+5)/(1+age/180); }
async function igSync(paksa){
  const c=igCfg(); if(!c.token&&!c.behold) { if(paksa) toast("Instagram belum terhubung"); return; }
  const last=c.sinkronAt?new Date(c.sinkronAt).getTime():0; if(!paksa&&Date.now()-last<8*3600e3) return;
  if(c.behold) return beholdSync(c, paksa);
  try{
    let tok=c.token, patch={};
    if(Date.now()-new Date(c.tokenAt||0).getTime()>7*864e5){ try{ const r=await igGet(`https://graph.instagram.com/refresh_access_token?grant_type=ig_refresh_token&access_token=${encodeURIComponent(tok)}`); if(r.access_token){ tok=r.access_token; patch.token=tok; patch.tokenAt=new Date().toISOString(); patch.kadaluarsa=new Date(Date.now()+(+r.expires_in||5184000)*1000).toISOString(); } }catch(_){} }
    const F="id,caption,media_type,media_url,thumbnail_url,permalink,timestamp,like_count,comments_count,children{media_type,media_url}";
    let url=`${IG_API}/me/media?fields=${encodeURIComponent(F)}&limit=50&access_token=${encodeURIComponent(tok)}`, all=[];
    for(let pg=0;pg<2&&url;pg++){ const r=await igGet(url); all=all.concat(r.data||[]); url=r.paging&&r.paging.next||""; }
    const pick=[]; all.forEach(m=>{ const sk=igSkor(m), base={permalink:m.permalink||"",caption:String(m.caption||"").slice(0,140),likes:+m.like_count||0,komentar:+m.comments_count||0,ts:m.timestamp||""};
      if(m.media_type==="IMAGE"&&m.media_url) pick.push({...base,id:"ig_"+m.id,url:m.media_url,skor:sk});
      else if(m.media_type==="CAROUSEL_ALBUM") ((m.children&&m.children.data)||[]).filter(x=>x.media_type==="IMAGE"&&x.media_url).slice(0,2).forEach((x,k)=>pick.push({...base,id:"ig_"+x.id,url:x.media_url,skor:sk*(k?0.85:1)}));
      else if(m.media_type==="VIDEO"&&m.thumbnail_url) pick.push({...base,id:"ig_"+m.id,url:m.thumbnail_url,skor:sk*0.6}); });
    pick.sort((a,b)=>b.skor-a.skor); const top=pick.slice(0,24), keep=new Set(top.map(x=>x.id)), hid=new Set(c.sembunyi||[]);
    for(const x of top) await Store.put("galeri",{...x,jenis:"ig",sembunyi:hid.has(x.id),diambil:new Date().toISOString()}).catch(()=>{});
    for(const g of state.galeri.filter(g=>g.jenis==="ig"&&!keep.has(g.id))) await Store.del("galeri",g.id).catch(()=>{});
    await Store.merge("rahasia","instagram",{...patch,sinkronAt:new Date().toISOString(),jumlahPost:all.length,galat:null});
    if(paksa) toast(`${top.length} foto terbaik dari ${all.length} postingan Instagram`);
  }catch(e){ await Store.merge("rahasia","instagram",{galat:String(e.message||e),galatAt:new Date().toISOString()}).catch(()=>{}); if(paksa) toast("Instagram: "+(e.message||e)); }
}
/* Behold.so (gratis): feed JSON Instagram tanpa membuat aplikasi Meta. Diambil admin maks. 3x sehari agar kuota gratis cukup. */
async function beholdSync(c, paksa){
  try{
    const r=await igGet(c.behold); const posts=Array.isArray(r.posts)?r.posts:[]; if(!posts.length) throw new Error("Feed kosong / belum siap");
    const best=x=>x&&x.sizes&&(x.sizes.large||x.sizes.full||x.sizes.medium)?(x.sizes.large||x.sizes.full||x.sizes.medium).mediaUrl:(x.mediaType==="VIDEO"?x.thumbnailUrl:x.mediaUrl);
    const pick=[]; posts.forEach(m=>{ const sk=igSkor({like_count:m.likeCount,comments_count:m.commentsCount,timestamp:m.timestamp}), base={permalink:m.permalink||"",caption:String(m.prunedCaption||m.caption||"").slice(0,140),likes:+m.likeCount||0,komentar:+m.commentsCount||0,ts:m.timestamp||""};
      if(m.mediaType==="CAROUSEL_ALBUM"&&Array.isArray(m.children)) m.children.filter(x=>x.mediaType!=="VIDEO").slice(0,3).forEach((x,k)=>{ const u=best(x); if(u) pick.push({...base,id:"ig_"+x.id,url:u,skor:sk*(k?0.85:1)}); });
      else { const u=best(m); if(u) pick.push({...base,id:"ig_"+m.id,url:u,skor:m.mediaType==="VIDEO"?sk*0.6:sk}); } });
    pick.sort((a,b)=>b.skor-a.skor); const top=pick.slice(0,24), keep=new Set(top.map(x=>x.id)), hid=new Set(c.sembunyi||[]);
    for(const x of top) await Store.put("galeri",{...x,jenis:"ig",sembunyi:hid.has(x.id),diambil:new Date().toISOString()}).catch(()=>{});
    for(const g of state.galeri.filter(g=>g.jenis==="ig"&&!keep.has(g.id))) await Store.del("galeri",g.id).catch(()=>{});
    await Store.merge("rahasia","instagram",{sinkronAt:new Date().toISOString(),jumlahPost:posts.length,username:r.username||c.username||"",galat:null});
    if(paksa) toast(`${top.length} foto dari ${posts.length} postingan terbaru @${r.username||"instagram"}`);
  }catch(e){ await Store.merge("rahasia","instagram",{galat:String(e.message||e),galatAt:new Date().toISOString()}).catch(()=>{}); if(paksa) toast("Behold: "+(e.message||e)); }
}

/* ---------- geotag absensi: hanya di lokasi Sabda Reswara ---------- */
const GEO_DEF = {lat:-7.3995827, lng:109.6959082, radius:10};
const geoCfg = () => { const g=byId("pengaturan","geo"); return g&&isFinite(+g.lat)&&isFinite(+g.lng)&&+g.lat?{lat:+g.lat,lng:+g.lng,radius:+g.radius||10}:null; };
const geoJarak = (a,b,c,d) => { const R=6371008.8, r=x=>x*Math.PI/180; const h=Math.sin(r(c-a)/2)**2+Math.cos(r(a))*Math.cos(r(c))*Math.sin(r(d-b)/2)**2; return 2*R*Math.asin(Math.min(1,Math.sqrt(h))); };
const GEO_BERLAKU = 120000; // verifikasi berlaku 2 menit, dan langsung batal saat aplikasi ditinggal
let GEO_SESI = null, geoBusy = null;
window.RA_geoReset = () => { GEO_SESI = null; };
const geoPerlu = () => !ME.super; // super admin tidak dibatasi (untuk koreksi data)
const geoLog = (j,x) => { try{ window.RA_logGeo && window.RA_logGeo(j,x); }catch(_){} };
const GEO_PIN = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s7-6.2 7-12a7 7 0 1 0-14 0c0 5.8 7 12 7 12z"/><circle cx="12" cy="10" r="2.6"/></svg>';
function geoOverlay(html){ const el=document.createElement("div"); el.className="geo-ov"; el.innerHTML=`<div class="geo-card" role="dialog" aria-modal="true">${html}</div>`; document.body.appendChild(el); return {el, close:()=>el.remove()}; }
function geoPesan(judul, pesan, bad, det){

    o.el.addEventListener("click",e=>{ if(e.target===o.el||e.target.closest("[data-geook]")){ o.close(); res(); } }); });
}
const GEO_ERR = {IZIN_DITOLAK:"Izin lokasi ditolak. Buka Pengaturan HP → Aplikasi → Sabda Reswara → Izin → Lokasi → Izinkan, lalu coba lagi.",
  PERLU_LOKASI_TEPAT:"Aktifkan “Lokasi akurat / tepat” untuk Sabda Reswara di Pengaturan HP → Aplikasi → Sabda Reswara → Izin → Lokasi.",
  LOKASI_MATI:"GPS / Lokasi di HP sedang mati. Nyalakan Lokasi dari panel atas HP, lalu coba lagi.",
  TIDAK_ADA_SINYAL:"Belum mendapat sinyal GPS. Pindah ke dekat pintu atau jendela, tunggu sebentar, lalu coba lagi."};
async function geoProses(aksi, tesSaja){
  const cfg=geoCfg();
  if(!cfg){ await geoPesan("Titik lokasi belum diatur","Super admin perlu membuka aplikasi versi terbaru sekali (atau mengatur titik di Lainnya → Pengaturan) agar absensi bisa dipakai.",true); return null; }
  if(!window.RA_geo){ await geoPesan("Absensi hanya dari aplikasi Android","Absensi wajib memakai GPS di aplikasi Android Sabda Reswara agar lokasi bisa diperiksa, termasuk deteksi lokasi palsu.",true); return null; }
  const ov=geoOverlay(`<div class="geo-spin" aria-hidden="true"></div><h3>Memeriksa lokasi…</h3><p>Tetap di tempat dan pastikan GPS menyala. Biasanya 3–15 detik.</p>`);
  let r;
  try{ r=await window.RA_geo.ambil({timeoutMs:15000,targetAcc:Math.min(8,cfg.radius),minSampel:3}); }
  catch(e){ ov.close(); const c=(e&&e.code)||""; geoLog("geo-tolak",{ket:`${aksi} · ${c||"gagal"}`}); await geoPesan("Lokasi tidak bisa diperiksa",GEO_ERR[c]||String((e&&e.message)||e),true); return null; }
  ov.close();
  const d=geoJarak(cfg.lat,cfg.lng,+r.lat,+r.lng), dd=Math.round(d*10)/10, acc=Math.round((+r.acc||0)*10)/10, aktif=Array.isArray(r.mockAktif)?r.mockAktif:[];
  let tolak="";
  if(r.mock) tolak="Lokasi palsu (fake GPS) terdeteksi. Matikan aplikasi lokasi palsu, lalu coba lagi.";
  else if(aktif.length) tolak=`Aplikasi lokasi palsu sedang aktif: ${aktif.join(", ")}. Matikan di Pengaturan → Opsi pengembang → Pilih aplikasi lokasi palsu → Tidak ada.`;
  else if(+r.fixAgeMs>15000) tolak="Lokasi yang terbaca sudah lama (bukan lokasi saat ini). Coba lagi.";
  else if(acc>Math.max(20,cfg.radius*2)) tolak=`Sinyal GPS belum akurat (±${acc} m). Pindah ke dekat pintu atau jendela, tunggu sebentar, lalu coba lagi.`;
  else if(d>cfg.radius) tolak=`Anda berada ±${dd} m dari titik Sabda Reswara. Absensi hanya bisa dalam radius ${cfg.radius} m.`;
  const det=`Jarak ${dd} m · akurasi ±${acc} m · ${+r.sampelGps||0} titik GPS`;
  if(tolak){ geoLog("geo-tolak",{ket:`${aksi} · ${tolak.split(/[.:]/)[0]}`,geo:{d:dd,acc,mock:!!r.mock,aktif}}); await geoPesan(tesSaja?"Di luar lokasi absensi":"Absensi ditolak",tolak,true,det); return null; }
  if(tesSaja){ await geoPesan("Lokasi sesuai",`Anda berada di dalam radius ${cfg.radius} m dari titik Sabda Reswara.`,false,det); }
  GEO_SESI={t:Date.now(), doc:{at:new Date(), d:dd, acc, lat:+(+r.lat).toFixed(7), lng:+(+r.lng).toFixed(7), mock:false, email:String(ME.email||"").toLowerCase(), src:"android"}};
  geoLog("geo-ok",{ket:`${aksi} · ${dd} m (±${acc} m)`,geo:{d:dd,acc}});
  return GEO_SESI;
}
async function geoWajib(aksi){

function feeRows(insId, m){

function buildSlip(who, m){
  const ins=insOf(who), peg=byId("pegawai",who); if(!ins&&!peg) return null;
  const sd=byId("slip",slipId(who,m))||{};

  if(ins){ o.nama=ins.namaLengkap||ins.nama; o.panggilan=ins.nama; o.jabatan=ins.jabatan||"Instructor"; o.mulai=ins.mulai||""; o.hp=ins.hp||"";
    o.fee=feeRows(who,m); const tf=o.fee.reduce((a,r)=>a+r.fee,0);
    o.pendapatan=[{ket:"Fee Murid",qty:o.fee.filter(r=>r.fee>0).length,total:tf}, ...(sd.tambahan||[]).filter(r=>r.ket&&lineTot(r)).map(r=>({ket:r.ket,qty:+r.qty||0,total:lineTot(r)}))];
  } else { o.nama=peg.namaLengkap||peg.nama; o.panggilan=peg.nama; o.jabatan=peg.jabatan||"Front Office"; o.mulai=peg.mulai||""; o.hp=peg.hp||"";
    o.auto=pegAuto(peg,o.periode); o.manual=!!(sd.manual&&sd.komponen); o.komponen=(o.manual?sd.komponen:o.auto).map(r=>({...r,total:lineTot(r)}));

    (sd.tambahan||[]).filter(r=>r.ket&&lineTot(r)).forEach(r=>o.pendapatan.push({ket:r.ket,qty:+r.qty||0,total:lineTot(r)}));
  }
  o.potongan=(sd.potongan||[]).filter(r=>r.ket&&+r.nominal).map(r=>({ket:r.ket,total:Math.round(+r.nominal)}));
  o.totP=o.pendapatan.reduce((a,r)=>a+r.total,0); o.totK=o.potongan.reduce((a,r)=>a+r.total,0); o.net=o.totP-o.totK;

  o.by=senderName();

}

      ${next?`<a class="btn primary" href="${esc(remindHref(tgl,next))}" target="_blank" rel="noopener" data-remind="${tgl}|${next.id}">Kirim berikutnya · ${esc(next.mulai)} ${esc(slotName(next).split(" ")[0])}</a>`:(ok.length?`<span class="pill good">Semua pengingat terkirim</span>`:"")}</div>
    ${js.length?`<div class="table-wrap"><table><tbody>${js.map(j=>{ const s=byId("siswa",j.siswaId); const h=remindHref(tgl,j); const S=sent[j.id]; const ins=slotIns(j);
      return `<tr><td class="num" style="width:96px;font-weight:600">${esc(j.mulai)}–${esc(j.selesai||"")}</td><td>${s?`<button type="button" class="namebtn" data-rekap="${s.id}">${esc(s.nama)}</button>`:`<b>${esc(slotName(j))}</b>`}${s&&s.status!=="aktif"?` <span class="pill warn">${esc(s.status)}</span>`:""}<div class="sub">${s?esc(kelasLabel(s)):"Belum terhubung ke data siswa"} · Ruang ${esc(j.ruang)}${ins?" · "+esc(ins.nama):""}</div></td>
        <td class="r" style="white-space:nowrap">${h?`<a class="btn small ${S?"":"wa"}" href="${esc(h)}" target="_blank" rel="noopener" data-remind="${tgl}|${j.id}">${S?"Kirim ulang":"Kirim WA"}</a>`:`<span class="sub">${!s?"–":s.status!=="aktif"?"Tidak dikirim ("+esc(s.status)+")":"Tanpa no. HP"}</span>`}${S?`<span class="sent">✓ ${hm(S.at)}${S.oleh?" · "+esc(S.oleh):""}</span>`:""}</td></tr>`; }).join("")}</tbody></table></div>`
    :`<div class="empty"><strong>Tidak ada sesi hari ${esc(dn)}</strong></div>`}
  </section>`
  + (prev?`<section class="panel"><div class="panel-h"><h2>Contoh pesan</h2></div><div class="panel-b"><div class="inote" style="white-space:pre-wrap">${esc(prev)}</div></div></section>`:"");
}

/* ---------- ekspor Excel ---------- */
let xlsxP=null;
function loadXLSX(){ if(window.XLSX) return Promise.resolve(window.XLSX); if(xlsxP) return xlsxP;
  xlsxP=new Promise((res,rej)=>{ const sc=document.createElement("script"); sc.src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"; sc.onload=()=>window.XLSX?res(window.XLSX):rej(new Error("load")); sc.onerror=()=>{xlsxP=null;rej(new Error("load"));}; document.head.appendChild(sc); });
  return xlsxP; }
function exportTables(){
  const insN=id=>(insOf(id)||{}).nama||"", progN=s=>(progOf(s)||{}).nama||"";
  const siswa=[...state.siswa].sort(byText(s=>s.nama)).map(s=>({"No. Induk":s.noInduk||"","Nama":s.nama,"Kelas":progN(s),"Level":s.level||"","Instruktur":insN(s.instrukturId),"SPP/bulan":+s.tarif||0,"Status":s.status,"Tgl masuk":s.tglMasuk||"","No. HP orang tua":s.wali||"","Catatan":s.catatan||"","ID":s.id}));
  const jadwal=[...state.jadwal].sort(byText(j=>HARI.indexOf(j.hari)+j.mulai+j.ruang)).map(j=>{const s=byId("siswa",j.siswaId);const i=slotIns(j);return {"Hari":j.hari,"Mulai":j.mulai,"Selesai":j.selesai,"Ruang":j.ruang,"Siswa":s?s.nama:(j.label||""),"Kelas":s?kelasLabel(s):"","Instruktur":i?i.nama:"","Catatan":j.catatan||"","ID":j.id};});
  const tagihan=[...state.tagihan].sort(byText(x=>x.bulan+((byId("siswa",x.siswaId)||{}).nama||""))).map(x=>{const s=byId("siswa",x.siswaId);return {"Bulan":x.bulan,"No. Induk":s?s.noInduk||"":"","Nama":s?s.nama:"","Kelas":s?kelasLabel(s):"","Keterangan":x.ket||("SPP "+fmtMonth(x.bulan)),"Jumlah":+x.jumlah||0,"Dibayar":paidOf(x),"Sisa":sisaOf(x),"Status":x.status,"Tgl bayar":x.tglBayar||"","Metode":x.metode||"","ID":x.id};});
  const absensi=[]; state.absensi.forEach(rec=>Object.entries(rec.tanda||{}).forEach(([jid,v])=>{ if(!v) return; const j=byId("jadwal",jid);const s=byId("siswa",(rec.siswa||{})[jid]||(j&&j.siswaId));const i=j&&slotIns(j);absensi.push({"Tanggal":rec.tanggal||rec.id,"Hari":dayName(rec.tanggal||rec.id),"Jam":j?j.mulai:"","Ruang":j?j.ruang:"","Siswa":s?s.nama:(j&&j.label)||"","Kelas":s?kelasLabel(s):"","Instruktur":i?i.nama:"","Status":ABS_LABEL[v]||v,"Catatan":(rec.catatan||{})[jid]||""});}));
  absensi.sort(byText(r=>r.Tanggal+r.Jam));
  const instruktur=[...state.instruktur].sort(byText(i=>i.nama)).map(i=>({"Nama":i.nama,"Bidang":i.bidang||"","No. HP":i.hp||"","Status":i.status||"aktif","Murid aktif":state.siswa.filter(s=>s.instrukturId===i.id&&s.status==="aktif").length}));
  const kelas=[...state.program].sort(byText(p=>p.nama)).map(p=>({"Kelas":p.nama,"Tarif standar":+p.tarif||0,"Durasi (menit)":+p.durasi||0,"Siswa aktif":state.siswa.filter(s=>s.programId===p.id&&s.status==="aktif").length,"Catatan":p.catatan||""}));
  const catatan=[...state.catatan].filter(n=>!isBulanan(n)||n.ringkasan||n.target||n.materi).sort(byText(n=>n.tanggal)).map(n=>{const s=byId("siswa",n.siswaId);return {"Jenis":isBulanan(n)?"Akhir bulan "+fmtMonth(n.bulan):"Catatan les","Tanggal":n.tanggal,"Siswa":s?s.nama:"","Kelas":s?kelasLabel(s):"","Instruktur":(insOf(n.instrukturId)||{}).nama||"","Ringkasan bulan":n.ringkasan||"","Target bulan depan":n.target||"","Materi":n.materi||"","Perkembangan":levelLabel(n.level),"Catatan":n.catatan||"","Latihan di rumah":n.latihan||"","Catatan internal":n.internal||""};});
  return {Siswa:siswa,Jadwal:jadwal,Tagihan:tagihan,Absensi:absensi,Catatan:catatan,Instruktur:instruktur,Kelas:kelas};
}
async function exportExcel(){
  try{
    const dl=await getDownloads(); if(!dl){ toast("Unduhan tidak tersedia di tampilan ini. Buka lewat claude.ai atau aplikasi Claude."); return; }
    const X=await loadXLSX(); const wb=X.utils.book_new(); const T=exportTables();
    Object.entries(T).forEach(([name,rows])=>{ const ws=rows.length?X.utils.json_to_sheet(rows):X.utils.aoa_to_sheet([["(kosong)"]]);
      if(rows.length){ const keys=Object.keys(rows[0]); ws["!cols"]=keys.map(k=>({wch:Math.min(40,Math.max(k.length,...rows.slice(0,200).map(r=>String(r[k]??"").length))+2)})); }
      X.utils.book_append_sheet(wb,ws,name); });
    const buf=X.write(wb,{bookType:"xlsx",type:"array"});
    await dl.save({filename:`Sabda Reswara - cadangan ${todayISO()}.xlsx`,data:new Blob([buf])}); toast("File Excel disimpan");
  }catch(e){ const c=e&&e.code; if(c==="declined") return; toast(c==="rate_limited"?"Masih ada permintaan unduh yang terbuka. Coba lagi sebentar.":e&&e.message==="load"?"Gagal memuat pembuat Excel. Periksa koneksi.":"Ekspor gagal. Coba lagi."); }
}

let toastT;
function toast(msg){ const r=$("#toastRoot"); r.innerHTML=`<div class="toast" role="status">${esc(msg)}</div>`; clearTimeout(toastT); toastT=setTimeout(()=>r.innerHTML="",2600); }

/* ---------- boot ---------- */
render();
let settled=false, rTimer=null;
const scheduleRender=()=>{ if(rTimer) return; rTimer=setTimeout(()=>{rTimer=null; render();},60); };
function goLocal(){ if(settled) return; settled=true; backend="lokal"; canWrite=true; loadLocal(); render(); }
(async()=>{
  try{
    if(!window.claude||typeof window.claude.use!=="function"){ goLocal(); return; }
    const timer=setTimeout(goLocal,11000);
    const d=await window.claude.use("db");
    clearTimeout(timer);
    if(!d){ goLocal(); return; }
    if(settled) return;
    settled=true; db=d; backend="db";
    try{ const u=await window.claude.use("user"); if(u){ const c=await u.can("data.write"); if(c===false) canWrite=false; applyRole(u); } }catch(_){}
    COLS.forEach(col=>{
      db.collection(col).limit(1000).onSnapshot(snap=>{ const docs=snap.docs.map(x=>({...x.data(),id:x.id})); const base=col.endsWith("Priv")?col.slice(0,-4):col;
        if(PRIV[base]){ RAW[col]=docs; gabungPriv(base); } else state[col]=docs; loaded[col]=true; if(PRIV[base]) setTimeout(privMigrasi,4000); scheduleRender(); },
        err=>{ if(err&&err.code==="revoked"){ canWrite=false; render(); } });
    });
    render();
  }catch(_){ goLocal(); }
})();
})();
</script>
