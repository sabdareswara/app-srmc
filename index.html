<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Sabda Reswara</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: app shell — side rail on desktop, bottom tab bar on phone; content is a single working column of ledgers and cards */
:root{
  --ink:#16362e;        /* papan tulis hijau tua */
  --ink-2:#2c5a4d;
  --paper:#f3f5f2;      /* kertas buku tulis, sedikit hijau */
  --surface:#ffffff;
  --line:#dbe2dd;
  --muted:#5f7068;
  --pencil:#e3a72f;     /* kuning pensil */
  --pencil-soft:#fbf0d6;
  --good:#2f7d4f; --good-bg:#e3f2e8;
  --warn:#a5650c; --warn-bg:#fcefd9;
  --bad:#b23b33;  --bad-bg:#f9e2df;
  --info:#2f5f8f; --info-bg:#e2ecf6;
  --rail:#16362e; --rail-fg:#e8efe9; --rail-muted:#9fb8ad;
  --f-display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-body:"Plus Jakarta Sans", "Segoe UI", system-ui, -apple-system, sans-serif;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --ink:#d9ece3;--ink-2:#a9cfc0;--paper:#0f1a17;--surface:#16231f;--line:#283a34;--muted:#93a89f;
  --pencil:#f0b84a;--pencil-soft:#3a2f17;
  --good:#7fd19f;--good-bg:#173226;--warn:#f0b866;--warn-bg:#3a2a12;--bad:#f08a80;--bad-bg:#3d1c19;--info:#8fb9e6;--info-bg:#18283a;
  --rail:#0b1411;--rail-fg:#e2ece6;--rail-muted:#7f978c;color-scheme:dark}}
:root[data-theme="dark"]{
  --ink:#d9ece3;--ink-2:#a9cfc0;--paper:#0f1a17;--surface:#16231f;--line:#283a34;--muted:#93a89f;
  --pencil:#f0b84a;--pencil-soft:#3a2f17;
  --good:#7fd19f;--good-bg:#173226;--warn:#f0b866;--warn-bg:#3a2a12;--bad:#f08a80;--bad-bg:#3d1c19;--info:#8fb9e6;--info-bg:#18283a;
  --rail:#0b1411;--rail-fg:#e2ece6;--rail-muted:#7f978c;color-scheme:dark}

*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5}
button,input,select,textarea{font:inherit;color:inherit}
.num{font-variant-numeric:tabular-nums}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;letter-spacing:-.01em}

.app{display:grid;grid-template-columns:232px 1fr;min-height:100%}
.rail{background:var(--rail);color:var(--rail-fg);padding-block:22px;padding-left:max(18px, env(safe-area-inset-left,0px));padding-right:18px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:26px}
.brand{display:flex;align-items:center;gap:10px}
.brand-mark{width:34px;height:34px;border-radius:8px;background:var(--pencil);display:grid;place-items:center;color:#16362e;font-family:var(--f-display);font-weight:800;font-size:18px}
.brand b{font-family:var(--f-display);font-weight:800;font-size:20px;letter-spacing:-.02em}
.brand small{display:block;color:var(--rail-muted);font-size:11.5px;letter-spacing:.02em}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{all:unset;cursor:pointer;display:flex;align-items:center;gap:11px;padding:9px 11px;border-radius:8px;color:var(--rail-muted);font-weight:600;font-size:14px}
.nav button svg{width:18px;height:18px;flex:none}
.nav button:hover{color:var(--rail-fg);background:rgba(255,255,255,.05)}
.nav button[aria-current="page"]{color:var(--rail-fg);background:rgba(255,255,255,.09);box-shadow:inset 3px 0 0 var(--pencil)}
.nav button:focus-visible{outline:2px solid var(--pencil);outline-offset:2px}
.rail-foot{margin-top:auto;font-size:12px;color:var(--rail-muted)}
.rail-foot .dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--pencil);margin-right:6px;vertical-align:1px}

.main{min-width:0;padding-block:26px 40px;padding-left:max(16px, env(safe-area-inset-left,0px));padding-right:max(16px, env(safe-area-inset-right,0px))}
.wrap{max-width:1080px;margin:0 auto;display:flex;flex-direction:column;gap:22px}
.head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:14px}
.head h1{font-size:clamp(26px,3.4vw,34px);font-weight:800}
.head p{margin:2px 0 0;color:var(--muted)}
.eyebrow{font-size:11.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:700}

.btn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--surface);padding:8px 14px;border-radius:8px;font-weight:600;font-size:14px;cursor:pointer}
.btn:hover{border-color:var(--ink-2)}
.btn.primary{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.btn.primary:hover{background:var(--ink-2)}
.btn.small{padding:5px 10px;font-size:13px}
.btn.ghost{background:transparent;border-color:transparent;color:var(--muted)}
.btn.ghost:hover{color:var(--ink);border-color:var(--line)}
.btn.danger{color:var(--bad)}
.btn:focus-visible,.chip:focus-visible,.mark button:focus-visible{outline:2px solid var(--pencil);outline-offset:2px}
.btn[disabled]{opacity:.5;cursor:not-allowed}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.panel-h{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid var(--line)}
.panel-h h2{font-size:17px;font-weight:600}
.panel-b{padding:14px 16px}

.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.stat{padding:14px 16px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);display:flex;flex-direction:column;gap:2px;min-width:0}
.stat .v{font-family:var(--f-display);font-size:28px;font-weight:800;line-height:1.1}
.stat .l{font-size:13px;color:var(--muted)}
.stat.hl{background:var(--pencil-soft);border-color:transparent}

.grid2{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:16px}

.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-size:11.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:700;padding:9px 16px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:11px 16px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
td.r,th.r{text-align:right}
td.r.num{white-space:nowrap}
.sub{color:var(--muted);font-size:12.5px}
.who{display:flex;align-items:center;gap:10px;min-width:0}
.av{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:12.5px;flex:none;background:var(--info-bg);color:var(--info)}

.pill{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:700;white-space:nowrap}
.pill.good{background:var(--good-bg);color:var(--good)}
.pill.warn{background:var(--warn-bg);color:var(--warn)}
.pill.bad{background:var(--bad-bg);color:var(--bad)}
.pill.info{background:var(--info-bg);color:var(--info)}
.pill.mute{background:var(--paper);color:var(--muted);border:1px solid var(--line)}

.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field label{font-size:12.5px;font-weight:600;color:var(--muted)}
input[type=text],input[type=search],input[type=number],input[type=date],input[type=month],input[type=tel],input[type=time],select,textarea{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 11px;width:100%;min-width:0}
input:focus,select:focus,textarea:focus{outline:2px solid var(--pencil);outline-offset:0;border-color:transparent}
.toolbar input[type=search]{width:220px;max-width:100%}
.toolbar select,.toolbar input[type=date],.toolbar input[type=month]{width:auto}

.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:4px 12px;font-size:13px;font-weight:600;cursor:pointer;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--paper)}

/* Jadwal mingguan */
.week{display:grid;grid-template-columns:repeat(6,minmax(140px,1fr));gap:10px;min-width:880px}
.day h3{font-family:var(--f-body);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700;padding:0 2px 6px;border-bottom:2px solid var(--line);margin-bottom:8px}
.day.today h3{color:var(--ink);border-color:var(--pencil)}
.slot{border:1px solid var(--line);border-left:4px solid var(--c,var(--ink-2));background:var(--surface);border-radius:8px;padding:8px 10px;margin-bottom:8px;font-size:13px}
.slot b{display:block;font-size:13.5px}
.empty-day{color:var(--muted);font-size:12.5px;padding:6px 2px}

/* Kelas cards */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.ccard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:8px;border-top:4px solid var(--c,var(--ink-2))}
.ccard h3{font-size:18px;font-weight:600}
.ccard .meta{display:grid;grid-template-columns:auto 1fr;gap:3px 12px;font-size:13px}
.ccard .meta span:nth-child(odd){color:var(--muted)}
.ccard .row{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:auto;padding-top:6px}

/* Absensi */
.mark{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.mark button{all:unset;cursor:pointer;width:34px;height:30px;display:grid;place-items:center;font-weight:700;font-size:13px;color:var(--muted);border-right:1px solid var(--line)}
.mark button:last-child{border-right:0}
.mark button[aria-pressed="true"][data-v="H"]{background:var(--good-bg);color:var(--good)}
.mark button[aria-pressed="true"][data-v="I"]{background:var(--info-bg);color:var(--info)}
.mark button[aria-pressed="true"][data-v="S"]{background:var(--warn-bg);color:var(--warn)}
.mark button[aria-pressed="true"][data-v="A"]{background:var(--bad-bg);color:var(--bad)}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:12.5px;color:var(--muted)}

.bar{height:8px;border-radius:99px;background:var(--line);overflow:hidden}
.bar > i{display:block;height:100%;background:var(--good);border-radius:99px}

.ann{display:flex;flex-direction:column;gap:0}
.ann article{padding:14px 16px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:4px}
.ann article:last-child{border-bottom:0}
.ann h3{font-family:var(--f-body);font-size:15px;font-weight:700}
.ann p{margin:0;white-space:pre-wrap;max-width:68ch}

.empty{padding:30px 16px;text-align:center;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:10px}
.empty strong{color:var(--ink);font-size:15px}
.note{font-size:12.5px;color:var(--muted)}
#tbBell{position:relative}#tbBell .bdg{position:absolute;top:1px;right:0;min-width:17px;height:17px;border-radius:9px;background:#e5484d;color:#fff;font-size:10px;font-weight:700;display:grid;place-items:center;padding:0 4px;line-height:1}#tbBell .bdg[hidden]{display:none}
.rcd{display:inline-grid;place-items:center;min-width:30px;height:30px;padding:0 6px;border-radius:8px;border:1px solid var(--line);background:var(--surface);font:inherit;font-size:12.5px;font-weight:600;color:var(--ink);margin:2px;cursor:default}
button.rcd{cursor:pointer}.rcd.rc-libur{background:rgba(229,72,77,.13);border-color:rgba(229,72,77,.45);color:var(--bad);text-decoration:line-through}
.rcd.rc-ijin{background:rgba(245,158,11,.16);border-color:rgba(245,158,11,.5);color:var(--warn)}.rcd.rc-pindah{background:rgba(59,130,246,.14);border-color:rgba(59,130,246,.45);color:var(--info)}
.rcd.ov{box-shadow:inset 0 -3px 0 var(--good)}.ntf{display:flex;gap:12px;align-items:flex-start;padding:12px 16px;border-top:1px solid var(--line);cursor:pointer}.ntf:first-child{border-top:0}.ntf.new{background:rgba(59,130,246,.07)}
.ntf .ic{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;background:var(--surface-2);color:var(--accent);flex:none}.ntf .ic svg{width:18px;height:18px}.ntf b{display:block;font-size:14px}
.banner{display:flex;gap:10px;align-items:flex-start;padding:10px 14px;border-radius:var(--r);background:var(--pencil-soft);font-size:13.5px}

/* Modal */
.scrim{position:fixed;inset:0;background:rgba(10,20,17,.45);display:grid;place-items:center;z-index:50;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.modal{background:var(--surface);border-radius:14px;width:min(520px,100%);max-height:100%;overflow:auto;box-shadow:0 20px 60px rgba(0,0,0,.25)}
.modal header{padding:16px 18px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}
.modal header h2{font-size:19px}
.modal form{padding:16px 18px;display:grid;grid-template-columns:1fr 1fr;gap:12px}
.modal .full{grid-column:1/-1}
.modal footer{grid-column:1/-1;display:flex;justify-content:space-between;gap:8px;padding-top:6px}
.days{display:flex;flex-wrap:wrap;gap:6px}
.days label{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line);border-radius:99px;padding:3px 10px;font-size:13px;cursor:pointer;color:var(--ink)}
.err{color:var(--bad);font-size:13px;grid-column:1/-1}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--paper);padding:9px 16px;border-radius:99px;font-size:14px;font-weight:600;z-index:60}

@media (max-width:900px){
  .stats{grid-template-columns:repeat(2,minmax(0,1fr))}
  .grid2{grid-template-columns:1fr}
}
@media (max-width:760px){
  .app{grid-template-columns:1fr}
  .rail{position:fixed;top:auto;bottom:0;left:0;right:0;height:auto;padding:6px max(6px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(6px,env(safe-area-inset-left,0px));z-index:40;flex-direction:row;gap:0}
  .brand,.rail-foot{display:none}
  .nav{flex-direction:row;justify-content:space-around;width:100%}
  .nav button{flex-direction:column;gap:3px;padding:6px 4px;font-size:10.5px;flex:1;justify-content:center;text-align:center}
  .nav button[aria-current="page"]{box-shadow:inset 0 -3px 0 var(--pencil)}
  .main{padding-bottom:calc(90px + env(safe-area-inset-bottom,0px))}
  .mobile-brand{display:flex!important}
  .toolbar input[type=search]{width:100%}
  th,td{padding-left:12px;padding-right:12px}
  .hide-sm{display:none}
  .modal form{grid-template-columns:1fr}
}
.mobile-brand{display:none;align-items:center;gap:9px}
.mobile-brand .brand-mark{width:28px;height:28px;font-size:15px}
.mobile-brand b{font-family:var(--f-display);font-weight:800;font-size:18px}
@media (prefers-reduced-motion:no-preference){
  .view{animation:rise .22s ease-out}
  @keyframes rise{from{transform:translateY(4px)}to{transform:none}}
}

.view{display:flex;flex-direction:column;gap:18px}
.linkbtn{all:unset;cursor:pointer;color:var(--ink);font-weight:700;text-decoration:underline;text-decoration-color:var(--pencil);text-underline-offset:3px}
.linkbtn:focus-visible{outline:2px solid var(--pencil)}
.pager{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:12px 16px;border-top:1px solid var(--line)}
.sw{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.sw.lg{width:14px;height:14px;margin:0;flex:none}
.av.lg{width:42px;height:42px;font-size:15px;background:var(--pencil-soft);color:var(--ink)}
.roomgrid{min-width:640px;table-layout:fixed}
.roomgrid th:first-child,.roomgrid td:first-child{width:74px}
.roomgrid td{padding:4px;border-right:1px solid var(--line);vertical-align:top}
.roomgrid td:last-child{border-right:0}
.slot-time{font-weight:700;font-size:13px;padding:8px 10px!important;color:var(--ink)}
.slot-time span{display:block;font-weight:500;color:var(--muted);font-size:11.5px}
.cell{height:52px}
.slotbtn{all:unset;box-sizing:border-box;cursor:pointer;display:block;width:100%;border-radius:7px;padding:6px 8px;background:color-mix(in srgb, var(--c) 13%, var(--surface));border-left:4px solid var(--c);margin-bottom:3px}
.slotbtn b{display:block;font-size:13px;line-height:1.25;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.slotbtn span{display:block;font-size:11.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.slotbtn.unlinked{background:var(--paper);border-left-style:dashed}
.slotbtn:hover{filter:brightness(.97)}
.slotbtn:focus-visible,.add-slot:focus-visible{outline:2px solid var(--pencil);outline-offset:1px}
.add-slot{all:unset;cursor:pointer;display:grid;place-items:center;width:100%;height:44px;border-radius:7px;color:transparent;font-weight:700}
.add-slot:hover,.add-slot:focus-visible{color:var(--muted);background:var(--paper)}
.check{display:flex;gap:8px;align-items:center;font-size:14px}
.modal.wide{width:min(720px,100%)}
.doc-wrap{padding:16px 18px;display:flex;flex-direction:column;gap:12px}
.doc-actions{display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end}
.paper{background:#fff;color:#1d2a26;border:1px solid var(--line);border-radius:8px;padding:22px 24px;font-size:12.5px;line-height:1.45;overflow-x:auto}
.paper .ph{display:flex;justify-content:space-between;gap:16px;align-items:flex-start;border-bottom:3px solid #16362e;padding-bottom:12px}
.paper .ph b{font-family:var(--f-display);font-size:17px;font-weight:800;letter-spacing:-.01em;color:#16362e}
.paper .ph small{display:block;color:#5f7068;white-space:pre-line;font-size:11.5px}
.paper .dt{text-align:right}
.paper .dt h2{font-family:var(--f-display);font-size:24px;letter-spacing:.06em;color:#16362e}
.paper table{font-size:12px;margin-top:12px;min-width:420px}
.paper th{color:#5f7068;font-size:10.5px;padding:6px 8px;border-bottom:1px solid #dbe2dd}
.paper td{padding:7px 8px;border-bottom:1px solid #eef1ef}
.paper .tot td{font-weight:800;border-top:2px solid #16362e;border-bottom:0;font-size:13px}
.paper .foot{display:flex;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-top:14px;color:#3d4b45}
.paper .stamp{border:2px solid #2f7d4f;color:#2f7d4f;font-weight:800;letter-spacing:.12em;padding:4px 12px;border-radius:6px;transform:rotate(-6deg);align-self:center}
.paper .stamp.due{border-color:#b23b33;color:#b23b33}
.paper .terbilang{background:#fbf0d6;border-radius:6px;padding:8px 10px;margin-top:10px;font-style:italic}
.people .who b{display:block}
.pill.part{background:var(--warn-bg);color:var(--warn)}
.btn.wa{background:var(--good);border-color:var(--good);color:var(--surface);text-decoration:none}
.btn.wa:hover{filter:brightness(1.08)}
.btn.wa.off{background:var(--paper);border-color:var(--line);color:var(--muted);cursor:not-allowed}
.sent{display:block;font-size:11.5px;color:var(--good);font-weight:600;margin-top:2px}
.mark button[aria-pressed="true"][data-v="G"]{background:var(--warn-bg);color:var(--warn)}
.ccard{border-top:1px solid var(--line)}
@media (hover:none){.add-slot{color:var(--line)}}

.namebtn{all:unset;cursor:pointer;font-weight:700;color:var(--ink);border-radius:4px;text-decoration:underline;text-decoration-color:transparent;text-underline-offset:3px;transition:text-decoration-color .15s ease}
.namebtn:hover,.namebtn:focus-visible{text-decoration-color:var(--pencil)}
.namebtn:focus-visible{outline:2px solid var(--pencil);outline-offset:2px}

/* ===== Refresh UI: lembut, modern, motif paranada ===== */
:root{--r:16px;--r-sm:11px;--shadow:0 1px 2px rgba(22,54,46,.05),0 6px 20px -8px rgba(22,54,46,.14);--shadow-lg:0 24px 60px -18px rgba(10,30,25,.35);--glass:rgba(255,255,255,.72);--hero1:#16362e;--hero2:#24584a;--hero-fg:#f3f6f1}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px -10px rgba(0,0,0,.55);--glass:rgba(22,35,31,.72);--hero1:#0d1f1a;--hero2:#1d4237;--hero-fg:#e8f1ec}}
:root[data-theme="dark"]{--shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px -10px rgba(0,0,0,.55);--glass:rgba(22,35,31,.72);--hero1:#0d1f1a;--hero2:#1d4237;--hero-fg:#e8f1ec}
body{background:var(--paper);-webkit-font-smoothing:antialiased}
.wrap{gap:20px}
.panel{border-radius:var(--r);box-shadow:var(--shadow);border-color:transparent;overflow:hidden}
.panel-h{padding:16px 18px;border-bottom-color:var(--line)}
.panel-h h2{font-family:var(--f-display);font-weight:700;font-size:18px;letter-spacing:-.01em}
.stat{border-radius:var(--r);box-shadow:var(--shadow);border-color:transparent;padding:16px 18px 14px;position:relative;gap:6px}
.stat .v{font-size:27px;letter-spacing:-.02em}
.stat .ic{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;background:var(--chip,var(--info-bg));color:var(--chipfg,var(--info))}
.stat .ic svg{width:19px;height:19px}
.stat.hl{background:var(--surface);box-shadow:var(--shadow), inset 0 0 0 2px var(--pencil)}
.stat .bar{margin-top:4px}
.btn{border-radius:var(--r-sm);padding:9px 15px;transition:transform .12s ease, box-shadow .15s ease, background .15s ease;box-shadow:0 1px 0 rgba(22,54,46,.04)}

th{background:var(--paper);position:sticky;top:0;z-index:1;padding-top:10px;padding-bottom:10px}
tbody tr{transition:background .12s ease}
tbody tr:hover{background:color-mix(in srgb, var(--pencil) 7%, transparent)}
td{border-bottom-color:color-mix(in srgb, var(--line) 70%, transparent)}

.pill{padding:3px 10px}

.ccard:hover{transform:translateY(-2px)}
.head h1{font-size:clamp(26px,3.2vw,32px)}

/* Rail */
.rail{background:linear-gradient(180deg,var(--rail),color-mix(in srgb, var(--rail) 82%, #000));gap:28px}
.brand-mark{border-radius:12px;box-shadow:0 8px 18px -8px var(--pencil);font-size:15px}

/* Hero Ringkasan */
.hero{position:relative;overflow:hidden;border-radius:22px;padding:22px 24px 20px;color:var(--hero-fg);background:radial-gradient(120% 140% at 100% 0%,var(--hero2) 0%,var(--hero1) 60%);box-shadow:var(--shadow-lg);display:flex;flex-direction:column;gap:14px}

.next .dot{width:8px;height:8px;border-radius:50%;background:var(--pencil);box-shadow:0 0 0 4px rgba(227,167,47,.25)}

/* Jadwal */
.roomgrid td{border-right-color:color-mix(in srgb, var(--line) 60%, transparent)}
.slotbtn{border-radius:10px;border-left-width:3px;transition:transform .12s ease}
.slotbtn:hover{transform:translateY(-1px)}

/* Modal: bottom-sheet di HP */
.scrim{backdrop-filter:blur(3px);background:rgba(10,20,17,.4)}
.modal{border-radius:22px;box-shadow:var(--shadow-lg)}
.modal header{border-bottom:0;padding:18px 20px 6px}

@media (prefers-reduced-motion:no-preference){
  .view > *{animation:rise .32s cubic-bezier(.2,.7,.2,1) both}
  .view > *:nth-child(2){animation-delay:.03s}.view > *:nth-child(3){animation-delay:.06s}.view > *:nth-child(4){animation-delay:.09s}.view > *:nth-child(5){animation-delay:.12s}
  @keyframes rise{from{transform:translateY(6px)}to{transform:none}}
  @keyframes sheet{from{transform:translateY(24px)}to{transform:none}}
  .modal{animation:sheet .25s cubic-bezier(.2,.7,.2,1)}
}

  .rail{background:var(--glass);backdrop-filter:saturate(1.6) blur(16px);-webkit-backdrop-filter:saturate(1.6) blur(16px);left:max(10px,env(safe-area-inset-left,0px));right:max(10px,env(safe-area-inset-right,0px));bottom:calc(10px + env(safe-area-inset-bottom,0px));border-radius:22px;box-shadow:var(--shadow-lg);padding:6px;border:1px solid color-mix(in srgb, var(--line) 70%, transparent)}
  .nav button{color:var(--muted);padding:7px 2px;border-radius:14px;font-size:10px}
  .nav button[aria-current="page"]{background:var(--ink);color:var(--paper);box-shadow:none}
  .main{padding-bottom:calc(104px + env(safe-area-inset-bottom,0px))}
  .scrim{align-items:end;padding-bottom:0}
  .modal{border-radius:22px 22px 0 0;width:100%;max-height:92%}
  .hero{padding:18px 18px 16px;border-radius:20px}
  .hero .kpi{min-width:0;flex:1 1 40%}
  .stats{gap:10px}
  .stat{padding:14px}
  .stat .v{font-size:22px}
}

.bar{background:var(--surface-2)}
.ccard:hover{transform:translateY(-2px);border-color:color-mix(in srgb,var(--accent) 40%,var(--line))}
.ccard h3{font-weight:600;font-size:16px}
.slotbtn{background:color-mix(in srgb,var(--c) 15%,var(--surface))}
.slotbtn.unlinked{background:var(--surface-2)}
.add-slot:hover,.add-slot:focus-visible{background:var(--surface-2)}
.day.today h3{color:var(--accent);border-color:var(--accent)}
.rk-sum div{background:var(--surface-2)}
.rk-head .av{background:var(--accent-soft);color:var(--accent);border-radius:14px}
.av.lg{background:var(--accent-soft);color:var(--accent)}
.modal{background:var(--surface);border:1px solid var(--line)}
.scrim{background:rgba(0,0,0,.55)}
.toast{background:var(--ink);color:var(--paper)}
.note{color:var(--muted)}

/* Ringkasan */
.kpi4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}
.kc{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px 20px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 12px;min-width:0;transition:border-color .15s ease}
.kc:hover{border-color:color-mix(in srgb,var(--accent) 40%,var(--line))}
.kc .t{font-size:13.5px;color:var(--ink-2)}
.kc .v{font-size:clamp(20px,1.6vw,26px);font-weight:600;letter-spacing:-.01em;line-height:1.15;grid-column:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kc .v small{font-size:.55em;font-weight:500;color:var(--muted);margin-right:3px}
.kc .ic{grid-row:1/3;grid-column:2;align-self:center;width:48px;height:48px;border-radius:12px;background:var(--surface-2);display:grid;place-items:center;color:var(--accent)}
.kc .ic svg{width:22px;height:22px}
.kc .d{grid-column:1/-1;font-size:12.5px;color:var(--muted)}
.up{color:var(--good);font-weight:600}.dn{color:var(--bad);font-weight:600}
.g2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.35fr);gap:16px}
.g3{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(0,1fr) minmax(0,1fr);gap:16px;align-items:start}
.chart{padding:4px 14px 6px}
.chart svg{width:100%;height:auto;display:block;overflow:visible}
.chart .gl{stroke:var(--line);stroke-dasharray:3 5}
.chart .ax{fill:var(--muted);font-size:11px;font-family:var(--f-body)}
.chart .bar-r{transition:opacity .15s ease}
.chart .bar-r:hover{opacity:.8}
.chart .pt{fill:var(--surface);stroke:var(--accent);stroke-width:2;opacity:0;transition:opacity .15s ease}
.chart .hit:hover + .pt,.chart .pt:hover{opacity:1}
.sumrow{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;padding:6px 20px 20px}
.sumrow b{display:block;font-size:22px;font-weight:600;letter-spacing:-.01em}
.sumrow span{font-size:12.5px;color:var(--muted)}
.lead{padding:0 20px;margin:0 0 6px;color:var(--muted);font-size:13px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{all:unset;cursor:pointer;padding:5px 12px;font-size:12.5px;color:var(--ink-2);border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{color:var(--accent);background:var(--accent-soft)}
.seg button:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.tl{display:flex;flex-direction:column;padding:6px 20px 16px}
.tl-i{display:grid;grid-template-columns:12px minmax(0,1fr);gap:12px;position:relative;padding-bottom:16px}
.tl-i::before{content:"";position:absolute;left:5px;top:16px;bottom:0;width:1.5px;background:var(--line)}
.tl-i:last-child{padding-bottom:0}
.tl-i:last-child::before{display:none}
.tl-i > i{width:10px;height:10px;border-radius:50%;margin-top:5px;background:var(--c);box-shadow:0 0 0 3px color-mix(in srgb,var(--c) 22%,transparent)}
.tl-i small{display:block;color:var(--muted);font-size:12px}
.tl-i div{font-size:13.5px;min-width:0}
.tl-i em{font-style:normal;color:var(--accent);font-weight:600}
.todo{display:flex;flex-direction:column;padding:2px 20px 16px}
.todo div{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);font-size:13.5px}
.todo div:last-child{border-bottom:0}
.todo small{display:block;color:var(--muted);font-size:12px}

@media (max-width:1180px){.g3{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}.g3 > :first-child{grid-column:1/-1}}
@media (max-width:1000px){.kpi4{grid-template-columns:repeat(2,minmax(0,1fr))}.g2{grid-template-columns:minmax(0,1fr)}}
@media (max-width:900px){
  .shell,.shell.mini{grid-template-columns:minmax(0,1fr)}
  .side{position:fixed;left:0;top:0;bottom:0;width:260px;transform:translateX(-102%);transition:transform .25s cubic-bezier(.2,.7,.2,1);padding-left:env(safe-area-inset-left,0px)}
  .shell.mini .side-brand b,.shell.mini .snav button span,.shell.mini .snav .chev,.shell.mini .snav .kids,.shell.mini .side-foot .ft{display:revert}
  .shell.mini .snav button{justify-content:flex-start;padding:0 12px}
  .shell.mini .snav .kid{padding-left:42px}
  .shell.mini .side-brand{padding:0 19px;justify-content:flex-start}
  .shell.mini .side-foot{justify-content:flex-start;padding-inline:19px}
  .shell.open .side{transform:none;box-shadow:var(--shadow-lg)}
  .shell.open + .side-scrim{display:block;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:44}
  .topbar{padding-left:max(10px,env(safe-area-inset-left,0px))}
  .tabsbar{padding-left:max(16px,env(safe-area-inset-left,0px))}
  .main{padding-left:max(16px,env(safe-area-inset-left,0px));padding-bottom:calc(40px + env(safe-area-inset-bottom,0px))}
}
@media (max-width:760px){
  .tsearch{display:none}
  .g3{grid-template-columns:minmax(0,1fr)}
  .kpi4{gap:10px}
  .kc{padding:14px;grid-template-columns:minmax(0,1fr)}
  .kc .ic{display:none}
  .kc .v{font-size:20px}
  .sumrow{grid-template-columns:repeat(2,minmax(0,1fr));row-gap:14px}
  .head h1{font-size:20px}
  .chart .ax{font-size:16px}
}

/* Catatan instruktur */
.nt-list{display:flex;flex-direction:column}
.nt{padding:14px 16px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
.nt:last-child{border-bottom:0}
.nt-top{display:flex;align-items:flex-start;gap:10px;flex-wrap:wrap}
.nt-top .who{flex:1;min-width:0}
.nt-body{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:8px 18px}
.nt-body div{min-width:0}
.nt-body h4{margin:0 0 2px;font-size:11.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:700}
.nt-body p{margin:0;white-space:pre-wrap;overflow-wrap:anywhere}
.nt-int{font-size:13px;color:var(--muted);border-left:3px solid var(--line);padding-left:10px;white-space:pre-wrap}
.nt-act{display:flex;flex-wrap:wrap;gap:6px}
.lv{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:700;white-space:nowrap}
.lv i{display:inline-flex;gap:2px}.lv i b{width:6px;height:12px;border-radius:2px;background:var(--line)}
.lv i b.on{background:var(--accent,var(--good))}
.rate{display:flex;flex-wrap:wrap;gap:6px}
.rate label{position:relative;border:1px solid var(--line);border-radius:99px;padding:5px 12px;font-size:13px;font-weight:600;cursor:pointer;color:var(--muted)}
.rate input{position:absolute;opacity:0;pointer-events:none}
.rate label:has(input:checked){background:var(--accent-soft,var(--pencil-soft));border-color:var(--accent,var(--ink));color:var(--accent,var(--ink))}
.rate label:has(input:focus-visible){outline:2px solid var(--accent,var(--pencil));outline-offset:2px}
.roster{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:8px;padding:12px 16px}
.rs{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:10px;padding:8px 10px;min-width:0}
.rs > div{flex:1;min-width:0}
.rs b{display:block;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rs .sub{display:block}
.rs .due{color:var(--warn)}
.modal textarea{resize:vertical}

/* Dokumen cetak selalu terang, apa pun temanya */
.paper{color-scheme:light}
.paper th{background:#f3f5f2!important;color:#5f7068!important;position:static}
.paper td{color:#1d2a26;border-bottom-color:#eef1ef}
.paper tbody tr:hover{background:transparent}
.paper .tot td{color:#16362e}
a.btn{text-decoration:none}
/* Jadwal: garis waktu per ruang */
.tl-wrap{overflow-x:auto}
.tl-grid{display:grid;grid-template-columns:58px repeat(var(--nr,5),minmax(140px,1fr));min-width:770px;position:relative}
.tl-head{position:sticky;top:0;z-index:2;background:var(--surface);border-bottom:1px solid var(--line);padding:10px 8px;font-size:12.5px;color:var(--muted);text-align:center}
.tl-axis{position:relative;border-right:1px solid var(--line)}
.tl-axis span{position:absolute;right:8px;transform:translateY(-50%);font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.tl-axis span:first-child{transform:translateY(2px)}
.tl-col{position:relative;border-right:1px solid var(--line);cursor:copy;background-image:repeating-linear-gradient(to bottom,transparent 0,transparent calc(var(--h) - 1px),var(--line) calc(var(--h) - 1px),var(--line) var(--h)),repeating-linear-gradient(to bottom,transparent 0,transparent calc(var(--h)/4 - 1px),color-mix(in srgb,var(--line) 45%,transparent) calc(var(--h)/4 - 1px),color-mix(in srgb,var(--line) 45%,transparent) calc(var(--h)/4))}
.tl-col:last-child{border-right:0}
.tl-col:hover{background-color:color-mix(in srgb,var(--accent) 3%,transparent)}
.tl-s{all:unset;box-sizing:border-box;position:absolute;left:4px;right:4px;border-radius:8px;padding:5px 8px;cursor:pointer;overflow:hidden;background:color-mix(in srgb,var(--c) 18%,var(--surface));border-left:3px solid var(--c);transition:transform .12s ease}
.tl-s:hover{transform:translateY(-1px);z-index:1}
.tl-s:focus-visible{outline:2px solid var(--accent)}
.tl-s b{display:block;font-size:12.5px;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tl-s span{display:block;font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tl-s.unlinked{background:var(--surface-2);border-left-style:dashed}
.tl-s.warn{box-shadow:inset 0 0 0 1.5px var(--bad)}
.tl-s .d{position:absolute;right:6px;top:5px;font-size:10.5px;color:var(--muted)}
.tl-now{position:absolute;left:0;right:0;height:2px;background:var(--bad);z-index:1;pointer-events:none}
.durs{display:flex;gap:6px;flex-wrap:wrap}
/* ===== Peran instruktur ===== */
.isess{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px 14px;padding:16px 20px;border-bottom:1px solid var(--line)}
.isess:last-child{border-bottom:0}
.isess .t{font-weight:600;font-size:13px;color:var(--accent)}
.isess .nm{font-size:15px}
.isess .mark{align-self:start;height:max-content}
.isess textarea{grid-column:1/-1;min-height:64px;resize:vertical;font-size:14px}
.isess .st{grid-column:1/-1;font-size:12px;color:var(--muted);display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.isess .st .ok{color:var(--good);font-weight:600}
.inote{margin-top:6px;padding:8px 10px;border-radius:8px;background:var(--surface-2);font-size:13px;white-space:pre-wrap;border-left:3px solid var(--accent)}
.inote small{display:block;color:var(--muted);font-size:11.5px;margin-top:4px}
.wa-sent{font-size:11.5px;color:var(--good);font-weight:600;white-space:nowrap}
.wk{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px;padding:6px 20px 20px}
.wk-d{border:1px solid var(--line);border-radius:10px;padding:10px 4px;text-align:center;display:flex;flex-direction:column;gap:2px;min-width:0}
.wk-d span{font-size:11.5px;color:var(--muted)}
.wk-d b{font-size:18px;font-weight:600}
.wk-d i{font-style:normal;font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wk-d.on{border-color:var(--good);background:var(--good-bg)}.wk-d.on i{color:var(--good);font-weight:700}
.wk-d.miss{border-color:color-mix(in srgb,var(--bad) 50%,var(--line))}.wk-d.miss i{color:var(--bad)}
.wk-d.today{box-shadow:inset 0 0 0 1px var(--accent)}
.wkt td,.wkt th{text-align:center;padding:10px 6px}
.wkt td:first-child,.wkt th:first-child{text-align:left;padding-left:20px}
.wkt .c-on{color:var(--good);font-weight:700}.wkt .c-miss{color:var(--bad);font-weight:700}.wkt .c-plan{color:var(--muted)}
.wknav{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.chk-ok{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:8px;background:var(--good-bg);color:var(--good);font-weight:600;font-size:14px}
@media (max-width:760px){.wk{gap:5px;padding:6px 14px 16px}.wk-d{padding:8px 2px}.wk-d b{font-size:15px}.wk-d i{font-size:10px}.isess{padding:14px 16px}}
/* Ketersediaan */
.avrow{display:grid;grid-template-columns:118px minmax(0,1fr) auto minmax(0,1fr);gap:8px;align-items:center}
.avrow .check{font-weight:600}
.avrow input[type=time]:disabled{opacity:.45}
.wlist{display:flex;flex-direction:column;gap:6px;margin:0;padding:0;list-style:none}
.wlist li{display:flex;gap:8px;align-items:flex-start;font-size:13.5px;line-height:1.4}
.wlist li::before{content:"!";flex:none;width:18px;height:18px;border-radius:50%;display:grid;place-items:center;font-size:11.5px;font-weight:800;background:var(--bad-bg);color:var(--bad);margin-top:1px}
.wlist li.soft::before{background:var(--warn-bg);color:var(--warn)}
.wlist li.ok::before{content:"✓";background:var(--good-bg);color:var(--good)}
.avtab td{white-space:nowrap}
#kMulai{width:auto}
.nt-ts{font-size:12px;color:var(--muted);border-top:1px dashed var(--line);padding-top:6px}
.rp-sec{margin-top:14px}
.rp-sec h3{font-size:12.5px;letter-spacing:.06em;text-transform:uppercase;color:#16362e;margin:0 0 6px;border-bottom:1px solid #dbe2dd;padding-bottom:4px}
.rp-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.rp-grid div{background:#f3f5f2;border-radius:6px;padding:6px 8px}
.rp-grid b{display:block;font-size:16px;color:#16362e}
.rp-grid span{font-size:10.5px;color:#5f7068}
.rp-dates{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.rp-dates span{border:1px solid #dbe2dd;border-radius:5px;padding:1px 6px;font-size:11px}
.rp-note p{margin:2px 0 6px;white-space:pre-wrap}
.rp-note b{font-size:11px;color:#5f7068;text-transform:uppercase;letter-spacing:.04em}
.rp-miss{border:1px dashed #e3a72f;border-radius:6px;padding:8px 10px;color:#a5650c;background:#fbf0d6;display:flex;justify-content:space-between;gap:8px;align-items:center;flex-wrap:wrap}
@media (max-width:760px){.rp-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
.aw-sum{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;padding:4px 20px 14px}
.aw-sum div{background:var(--surface-2);border-radius:10px;padding:10px 12px}
.aw-sum b{display:block;font-size:20px;font-weight:600}
.aw-sum span{font-size:12px;color:var(--muted)}
.aw-day{display:grid;grid-template-columns:110px minmax(0,1fr);gap:10px 14px;padding:12px 20px;border-top:1px solid var(--line)}
.aw-day h4{margin:0;font-size:14px}
.aw-day h4 small{display:block;font-weight:400;color:var(--muted);font-size:12px;margin-top:2px}
.aw-bar{position:relative;height:26px;border-radius:7px;background:var(--surface-2);overflow:hidden;margin-bottom:8px}
.aw-bar i{position:absolute;top:0;bottom:0}
.aw-bar i.avl{background:color-mix(in srgb,var(--good) 22%,transparent)}
.aw-bar i.bz{background:var(--accent);opacity:.85;border-left:1px solid var(--surface);border-right:1px solid var(--surface)}
.aw-bar i.bz.x{background:var(--bad)}
.aw-row{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:12.5px}
.aw-row .lbl{color:var(--muted);min-width:46px}
.aw-chip{border:1px solid var(--line);border-radius:7px;padding:3px 9px;font-size:12.5px;background:var(--surface)}
.aw-chip.free{border-color:color-mix(in srgb,var(--good) 50%,var(--line));color:var(--good)}
button.aw-chip{cursor:pointer;font:inherit;font-size:12.5px}
button.aw-chip:hover{background:var(--good-bg)}
.aw-legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);padding:0 20px 12px}
.aw-legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:5px;vertical-align:-2px}
@media (max-width:760px){.aw-sum{grid-template-columns:repeat(2,minmax(0,1fr))}.aw-day{grid-template-columns:minmax(0,1fr);gap:6px}}
.ktag{font-style:normal;font-size:10px;font-weight:700;background:var(--warn-bg);color:var(--warn);border-radius:4px;padding:0 5px;margin-right:5px;vertical-align:1px}
#kRes td{white-space:nowrap}
#kRes td .sub{white-space:normal}
#kRes .btn{white-space:nowrap}
.avtab td.off{color:var(--muted)}
.kres{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px}
.insfree{display:flex;flex-wrap:wrap;gap:6px;padding:0 20px 18px}
.insfree span{border:1px solid var(--line);border-radius:7px;padding:4px 10px;font-size:13px}
.insfree span small{color:var(--muted);margin-left:4px}
@media (max-width:760px){.kres{grid-template-columns:minmax(0,1fr)}.avrow{grid-template-columns:96px minmax(0,1fr) auto minmax(0,1fr);gap:6px}}

/* ===== Tema biru (komposisi seperti aplikasi perbankan): pita biru di atas, kartu putih membulat, aksen kuning ===== */
:root{--accent:#0B63CE;--accent-2:#2F80ED;--accent-soft:rgba(11,99,206,.10);--gold:#FFC72C;--gold-ink:#3A2A00;
  --ink:#0F2A4F;--ink-2:#34507A;--paper:#EEF3FA;--surface:#FFFFFF;--surface-2:#F2F6FC;--line:#E0E8F3;--muted:#6A7C96;
  --good:#12A26F;--good-bg:rgba(18,162,111,.12);--warn:#C98204;--warn-bg:rgba(255,199,44,.20);--bad:#E5484D;--bad-bg:rgba(229,72,77,.11);--info:#0B63CE;--info-bg:rgba(11,99,206,.10);
  --band:#0B4BA3;--band-2:#1766CC;--side:#0A3F8C;--side-2:#0B4BA3;--side-fg:#FFFFFF;--side-muted:rgba(255,255,255,.72);--side-hover:rgba(255,255,255,.10);
  --card-shadow:0 8px 24px -14px rgba(13,43,85,.30);--glass:rgba(255,255,255,.86);color-scheme:light}
:root[data-theme="dark"]{--accent:#4C9BFF;--accent-2:#78B4FF;--accent-soft:rgba(76,155,255,.16);
  --ink:#E8F0FB;--ink-2:#BCD0EC;--paper:#06142B;--surface:#0C2142;--surface-2:#11294F;--line:#1C3963;--muted:#8FA6C6;
  --good:#2FD39A;--good-bg:rgba(47,211,154,.14);--warn:#FFC72C;--warn-bg:rgba(255,199,44,.14);--bad:#FF6B70;--bad-bg:rgba(255,107,112,.15);--info:#4C9BFF;--info-bg:rgba(76,155,255,.15);
  --band:#0A2F66;--band-2:#0F4590;--side:#071D40;--side-2:#0A2F66;--card-shadow:0 10px 28px -16px rgba(0,0,0,.7);--glass:rgba(12,33,66,.86);color-scheme:dark}
html,body{margin:0}
body{background:var(--paper)}
/* sisi kiri biru */
.side{background:linear-gradient(180deg,var(--side-2),var(--side));border-right:0}
.side-brand .logo{background-color:#fff!important;border-radius:9px!important;box-shadow:0 0 0 3px #fff!important}
.side-brand b{color:#fff}
.snav button{color:var(--side-fg)}
.snav button svg.i{color:var(--side-muted)}
.snav button[aria-current="page"]{background:rgba(255,255,255,.16);color:#fff}
.snav button[aria-current="page"] svg.i{color:var(--gold)}
.snav .kid{color:var(--side-muted)}
.snav .kid[aria-current="page"]{color:#fff}
.snav .kid[aria-current="page"]::before{background:var(--gold)}
.side-foot{border-top-color:rgba(255,255,255,.14);color:var(--side-muted)}
.side-foot .dot{background:var(--gold)}
/* pita biru: topbar + tab halaman + judul halaman */

/* ===== Tampilan segar · Sabda Reswara (logo vektor, font Plus Jakarta Sans) ===== */
:root{--brand:#1E78F5;--brand-deep:#1565E0;--brand-sky:#3D9BFF;--brand-teal:#22C3D6;
  --accent:#1E78F5;--accent-2:#1565E0;--accent-soft:rgba(30,120,245,.10);
  --ink:#0E1B33;--ink-2:#3A4A66;--paper:#F4F7FC;--surface:#FFFFFF;--surface-2:#F2F6FC;--line:#E4EAF3;--muted:#6B7A93;
  --band:#1565E0;--band-2:#2C86F7;
  --side:#FFFFFF;--side-2:#FFFFFF;--side-fg:#22324D;--side-muted:#8391A7;--side-hover:#F1F5FC;
  --card-shadow:0 1px 2px rgba(15,35,75,.04),0 12px 32px -20px rgba(15,35,75,.28);
  --f-display:"Plus Jakarta Sans","Inter",system-ui,-apple-system,"Segoe UI",sans-serif;--f-body:"Plus Jakarta Sans","Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
  --hero-bg:radial-gradient(90% 120% at 100% 0%,rgba(34,195,214,.45),rgba(34,195,214,0) 58%),radial-gradient(60% 90% at 0% 100%,rgba(140,195,255,.30),rgba(140,195,255,0) 60%),linear-gradient(180deg,var(--band),var(--band-2))}
:root[data-theme="dark"]{--brand:#4C9BFF;--accent:#4C9BFF;--accent-2:#78B4FF;--accent-soft:rgba(76,155,255,.15);
  --ink:#E8F0FB;--ink-2:#BCD0EC;--paper:#071328;--surface:#0D1D38;--surface-2:#112645;--line:#1B3359;--muted:#8FA6C6;
  --band:#0F3E8C;--band-2:#1756B8;--side:#0A1830;--side-2:#0A1830;--side-fg:#DCE7F7;--side-muted:#8399BA;--side-hover:rgba(255,255,255,.06);
  --card-shadow:0 1px 0 rgba(255,255,255,.03),0 14px 34px -22px rgba(0,0,0,.9)}
body{font-family:var(--f-body);-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;font-feature-settings:"ss01"}
h1,h2,h3,.panel-h h2{font-family:var(--f-display);letter-spacing:-.015em}
/* sisi kiri: putih bersih, item aktif berupa pil biru lembut */

.side-brand{height:68px;gap:10px}

.snav button{color:var(--side-fg);border-radius:12px;font-weight:500}
.snav button svg.i{color:var(--side-muted)}
.snav button:hover{background:var(--side-hover)}
.snav button[aria-current="page"]{background:var(--accent-soft);color:var(--accent);font-weight:700}
.snav button[aria-current="page"] svg.i{color:var(--accent)}
.snav .kid{color:var(--side-muted)}
.snav .kid[aria-current="page"]{color:var(--accent)}
.snav .kid[aria-current="page"]::before{background:var(--accent)}
.side-foot{border-top-color:var(--line);color:var(--muted)}
.side-foot .dot{background:var(--good)}
/* kartu & komponen */
.panel,.stat,.ccard,.kc{border-radius:20px;border:1px solid var(--line);box-shadow:var(--card-shadow)}
.banner{border-radius:16px;border:1px solid color-mix(in srgb,var(--accent) 20%,transparent);border-left:1px solid color-mix(in srgb,var(--accent) 20%,transparent);background:linear-gradient(0deg,var(--accent-soft),var(--accent-soft)),var(--surface);box-shadow:none}
.kc .ic{border-radius:14px;background:linear-gradient(135deg,rgba(30,120,245,.14),rgba(34,195,214,.14));color:var(--accent)}
.btn{border-radius:12px;font-weight:600}
.btn.primary{background:linear-gradient(135deg,var(--brand-deep),var(--brand) 55%,var(--brand-sky));border-color:transparent;color:#fff;box-shadow:0 8px 18px -10px rgba(30,120,245,.75)}
.btn.primary:hover{filter:brightness(1.06);background:linear-gradient(135deg,var(--brand-deep),var(--brand) 55%,var(--brand-sky));border-color:transparent;color:#fff}

.chip{border-radius:99px}

input,select,textarea{border-radius:12px}

.geo-card .gi.bad{background:var(--bad-bg);color:var(--bad)}.geo-card .gi.ok{background:var(--good-bg);color:var(--good)}
.geo-card .gi svg{width:30px;height:30px}
.geo-card h3{margin:0;font-size:18px}
.geo-card p{margin:0;color:var(--ink-2);font-size:14px;line-height:1.5}
.geo-card .det{font-size:12.5px;color:var(--muted)}
.geo-spin{width:60px;height:60px;margin:0 auto;border-radius:50%;border:5px solid var(--accent-soft);border-top-color:var(--accent);animation:geoSpin 1s linear infinite}
@keyframes geoSpin{to{transform:rotate(360deg)}}
.adm-info{grid-column:1/-1;background:var(--warn-bg);border-radius:12px;padding:8px 12px;font-size:13px;color:var(--ink)}.adm-info small{display:block;color:var(--muted);font-size:11.5px;margin-top:2px}
.pbt{display:flex;gap:12px;align-items:flex-start;padding:12px 18px;border-top:1px solid var(--line)}.pbt:first-child{border-top:0}
.pbt .dt{flex:none;width:52px;text-align:center;border-radius:12px;background:var(--surface-2);padding:6px 0;line-height:1.1}.pbt .dt b{display:block;font-size:19px}.pbt .dt small{font-size:11px;color:var(--muted);text-transform:uppercase}
.pbt .bd{flex:1;min-width:0}.pbt .bd .sub{display:block}
.me.has-foto{padding:0;overflow:hidden;background:#fff}.me.has-foto img{width:100%;height:100%;object-fit:cover;display:block;border-radius:50%}
.av.foto{padding:0;overflow:hidden;background:var(--surface-2)}.av.foto img{width:100%;height:100%;object-fit:cover;display:block}
.pf-hero{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.pf-ph{width:108px;height:108px;border-radius:50%;flex:none;overflow:hidden;background:linear-gradient(135deg,var(--brand-deep),var(--brand-teal));color:#fff;display:grid;place-items:center;font-size:36px;font-weight:800;box-shadow:0 0 0 4px var(--surface),0 10px 26px -12px rgba(15,35,75,.5)}
.pf-ph img{width:100%;height:100%;object-fit:cover}
.pf-hero h2{font-size:22px;margin:0}.pf-hero .sub{display:block}
@media (max-width:600px){.pf-hero{flex-direction:column;align-items:flex-start;gap:12px}.pf-hero>.btn{width:100%;justify-content:center}}
.pf-bio{margin:14px 0 0;color:var(--ink-2);line-height:1.6;white-space:pre-line}
.pf-soc{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.pf-soc a{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);border-radius:99px;padding:7px 13px 7px 10px;font-size:13.5px;font-weight:600;color:var(--ink);text-decoration:none;background:var(--surface)}
.pf-soc a svg{width:17px;height:17px;color:var(--accent)}
.pf-pick{display:flex;align-items:center;gap:14px}.pf-pick .pf-ph{width:84px;height:84px;font-size:28px}
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px}
.gal figure{margin:0;position:relative;border-radius:14px;overflow:hidden;aspect-ratio:1;background:var(--surface-2)}
.gal img{width:100%;height:100%;object-fit:cover;display:block}.gal figure.off img{opacity:.3;filter:grayscale(1)}
.gal figcaption{position:absolute;left:6px;right:6px;bottom:6px;display:flex;gap:4px;justify-content:space-between;align-items:center;white-space:nowrap}
.gal figcaption span{background:rgba(0,0,0,.55);color:#fff;font-size:11px;border-radius:99px;padding:2px 8px}
.gal figcaption button{all:unset;cursor:pointer;background:rgba(0,0,0,.6);color:#fff;border-radius:99px;font-size:11px;padding:3px 9px}

/* ---------- util ---------- */
const $ = (s,el=document)=>el.querySelector(s);
const esc = s => String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const rp = n => "Rp " + Math.round(Number(n)||0).toLocaleString("id-ID");
const pad = n => String(n).padStart(2,"0");
const todayISO = () => { const d=new Date(); return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate()); };
const thisMonth = () => todayISO().slice(0,7);
const DURASI = [30,45,60];
const jamBuka = hari => hari==="Minggu" ? ["08:40","18:40"] : ["10:00","20:00"];
const toMin = t => { const [h,m]=String(t||"0:0").split(":").map(Number); return (h||0)*60+(m||0); };
const toHM = n => String(Math.floor(n/60)).padStart(2,"0")+":"+String(n%60).padStart(2,"0");
const durOf = j => toMin(j.selesai)-toMin(j.mulai);
const overlap = (a,b) => toMin(a.mulai)<toMin(b.selesai) && toMin(b.mulai)<toMin(a.selesai);
const outOfHours = j => { const [o,c]=jamBuka(j.hari); return toMin(j.mulai)<toMin(o)||toMin(j.selesai)>toMin(c); };
const isoAdd = (iso,n) => { const d=new Date(iso+"T00:00:00"); d.setDate(d.getDate()+n); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); };
const BULAN = ["Januari","Februari","Maret","April","Mei","Juni","Juli","Agustus","September","Oktober","November","Desember"];

/* Data pribadi (no. HP orang tua & instruktur) disimpan terpisah di koleksi "...Priv" yang hanya bisa dibaca admin.
   Aplikasi menggabungkannya kembali untuk admin, sehingga instruktur tidak pernah menerima data ini. */
const PRIV = {siswa:["wali"], instruktur:["hp"]};
const RAW = {};
function splitPriv(col, obj){ const f=PRIV[col]; if(!f) return {base:obj, priv:null}; const base={...obj}, priv={}; let ada=false; f.forEach(k=>{ if(k in base){ priv[k]=base[k]; delete base[k]; ada=true; } }); return {base, priv:ada?priv:null}; }
function gabungPriv(base){ const f=PRIV[base]; if(!f) return; const pv=new Map((RAW[base+"Priv"]||[]).map(x=>[x.id,x]));
  state[base]=(RAW[base]||[]).map(d=>{ const x=pv.get(d.id); if(!x) return d; const o={...d}; f.forEach(k=>{ if(x[k]!==undefined&&x[k]!==null) o[k]=x[k]; }); return o; }); }
let privMigrasiJalan=false; const privSudah=new Set();
async function privMigrasi(){
  if(privMigrasiJalan||ROLE==="instruktur"||!canWrite||backend==="lokal") return;
  if(!Object.keys(PRIV).every(c=>loaded[c]&&loaded[c+"Priv"])) return;
  const kerja=[]; Object.entries(PRIV).forEach(([c,f])=>(RAW[c]||[]).forEach(d=>{ if(!privSudah.has(c+"/"+d.id)&&f.some(k=>k in d&&d[k]!==null)) kerja.push([c,f,d]); }));
  if(!kerja.length) return; privMigrasiJalan=true;
  let n=0; for(const [c,f,d] of kerja){ privSudah.add(c+"/"+d.id); try{ const pv=(RAW[c+"Priv"]||[]).find(x=>x.id===d.id)||{}, priv={id:d.id}, hapus={};
      f.forEach(k=>{ if(k in d&&d[k]!==null){ if(!(k in pv)||pv[k]===""||pv[k]===null) priv[k]=d[k]; hapus[k]=null; } });
      const pr=db.collection(c+"Priv").doc(d.id); if(typeof pr.merge==="function") await pr.merge(priv); else await pr.set({...pv,...priv});
      const ref=db.collection(c).doc(d.id); if(typeof ref.merge==="function") await ref.merge(hapus); else { const b={...d}; f.forEach(k=>delete b[k]); await ref.set(b); }
      n++; }catch(e){ console.warn("migrasi privasi",e); } }
  privMigrasiJalan=false; if(n) console.info(`privasi: ${n} data dipindahkan`);
}
const Store = {
  async put(col, obj){
    if(!canWrite){ toast("Akun ini hanya bisa melihat"); throw new Error("readonly"); }
    if(!obj.id) obj.id = uid();
    const clean = JSON.parse(JSON.stringify(obj));
    // optimistic local update
    const arr=state[col]; const i=arr.findIndex(x=>x.id===clean.id); if(i>=0) arr[i]=clean; else arr.push(clean);
    if(backend==="db"){ try{ const sp=splitPriv(col,clean); await db.collection(col).doc(clean.id).set(sp.base); if(PRIV[col]) await db.collection(col+"Priv").doc(clean.id).set({id:clean.id,...(sp.priv||{})}); }catch(e){ handleDbErr(e); throw e; } }
    else saveLocal();
    render(); return clean;
  },
  async del(col, id){
    if(!canWrite){ toast("Akun ini hanya bisa melihat"); return; }
    state[col]=state[col].filter(x=>x.id!==id);
    if(backend==="db"){ try{ await db.collection(col).doc(id).delete(); if(PRIV[col]) await db.collection(col+"Priv").doc(id).delete().catch(()=>{}); }catch(e){ handleDbErr(e); throw e; } }
    else saveLocal();
    render();
  },
  // gabungkan sebagian field (map bersarang ikut digabung; nilai null = hapus kunci)
  async merge(col, id, patch){
    if(!canWrite){ toast("Akun ini hanya bisa melihat"); throw new Error("readonly"); }
    const arr=state[col]; const i=arr.findIndex(x=>x.id===id);
    const merged=deepMerge(i>=0?arr[i]:{id}, {...patch,id});
    if(i>=0) arr[i]=merged; else arr.push(merged);
    if(backend==="db"){ const ref=db.collection(col).doc(id);
      try{ const sp=splitPriv(col,JSON.parse(JSON.stringify({...patch,id})));
        if(typeof ref.merge==="function") await ref.merge(sp.base); else await ref.set(splitPriv(col,JSON.parse(JSON.stringify(merged))).base);
        if(sp.priv){ const pr=db.collection(col+"Priv").doc(id); if(typeof pr.merge==="function") await pr.merge({id,...sp.priv}); else await pr.set({id,...splitPriv(col,merged).priv}); }
      }catch(e){ handleDbErr(e); throw e; } }
    else saveLocal();
    render(); return merged;
  }
};
function deepMerge(base, patch){
  const out={...base};
  Object.entries(patch).forEach(([k,v])=>{
    if(v===null||v===undefined) delete out[k];
    else if(typeof v==="object" && !Array.isArray(v)) out[k]=deepMerge(out[k]&&typeof out[k]==="object"?out[k]:{}, v);
    else out[k]=v;
  });
  return out;
}
function handleDbErr(e){
  const c=e&&e.code;
  if(c==="invalid_argument"){ canWrite=false; toast("Perubahan ditolak: akun ini hanya bisa melihat"); render(); }
  else if(c==="quota_exceeded") toast("Penyimpanan penuh. Hapus data lama dulu.");
  else if(c==="resource_exhausted") toast("Terlalu cepat. Coba lagi sebentar.");
  else toast("Gagal menyimpan. Periksa koneksi lalu coba lagi.");
}

const jm = t => String(t||"").replace(":",".");
// tersedia: { Senin:{mulai,selesai}, ... } — kosong/tidak ada = belum diatur (dianggap bisa kapan saja)
const tersediaOf = id => { const i=insOf(id); const t=i&&i.tersedia; return t&&HARI.some(h=>t[h]&&t[h].mulai)?t:null; };
const availText = t => t?HARI.filter(h=>t[h]&&t[h].mulai).map(h=>`${h} ${jm(t[h].mulai)}–${jm(t[h].selesai)}`).join(", "):"";
function availCheck(id, hari, mulai, selesai){
  const i=insOf(id), t=tersediaOf(id); if(!i||!t) return "";
  const r=t[hari];
  if(!r||!r.mulai) return `${i.nama} tidak mengajar hari ${hari} (jadwal mengajar: ${availText(t)}).`;
  if(toMin(mulai)<toMin(r.mulai)||toMin(selesai)>toMin(r.selesai)) return `${i.nama} hanya bisa mengajar hari ${hari} pukul ${jm(r.mulai)}–${jm(r.selesai)}.`;
  return "";
}
// Semua peringatan untuk satu rencana sesi. k: jam | ruang | ins | siswa (bentrok, menolak simpan) · avail (di luar jam mengajar, bisa dipaksa)
function cekSlot({hari,mulai,selesai,ruang,insId,siswaId,exceptId}){
  const w=[], me={hari,mulai,selesai}, [o,c]=jamBuka(hari);
  if(toMin(mulai)<toMin(o)||toMin(selesai)>toMin(c)) w.push({k:"jam",t:`Di luar jam operasional ${hari} (${jm(o)}–${jm(c)}).`});
  const others=state.jadwal.filter(x=>x.id!==exceptId&&x.hari===hari&&overlap(x,me));
  if(ruang) others.filter(x=>x.ruang===ruang).forEach(x=>{ const i=slotIns(x); w.push({k:"ruang",t:`Bentrok ruang: Ruang ${ruang} sudah terisi ${slotName(x)} pukul ${jm(x.mulai)}–${jm(x.selesai)}${i?" ("+i.nama+")":""}.`}); });
  if(insId){ const i=insOf(insId);
    others.filter(x=>(slotIns(x)||{}).id===insId).forEach(x=>w.push({k:"ins",t:`Jam sudah terisi: ${i?i.nama:"Instruktur"} mengajar ${slotName(x)} di Ruang ${x.ruang} pukul ${jm(x.mulai)}–${jm(x.selesai)}.`}));
    const a=availCheck(insId,hari,mulai,selesai); if(a) w.push({k:"avail",t:a}); }
  const s=byId("siswa",siswaId);
  if(s) others.filter(x=>{ const o2=byId("siswa",x.siswaId); return o2&&personKey(o2)===personKey(s); }).forEach(x=>w.push({k:"siswa",t:`${s.nama} sudah ada sesi ${kelasLabel(byId("siswa",x.siswaId))} di Ruang ${x.ruang} pukul ${jm(x.mulai)}–${jm(x.selesai)}.`}));
  return w;
}

const hpDigits = v => { let d=String(v||"").replace(/\D/g,""); if(d.startsWith("0")) d="62"+d.slice(1); else if(d.startsWith("8")) d="62"+d; return d; };
const toLoginId = v => { v=String(v||"").trim(); if(v.includes("@")) return /^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(v)?v.toLowerCase():""; const d=hpDigits(v); return d.length>=9&&d.length<=15?d+"@"+HP_DOMAIN:""; };

function terbilang(n){ n=Math.floor(Math.abs(+n||0)); const a=["","satu","dua","tiga","empat","lima","enam","tujuh","delapan","sembilan","sepuluh","sebelas"];
  const t=x=> x<12?a[x] : x<20?t(x-10)+" belas" : x<100?t(Math.floor(x/10))+" puluh"+(x%10?" "+t(x%10):"") : x<200?"seratus"+(x-100?" "+t(x-100):"") : x<1000?t(Math.floor(x/100))+" ratus"+(x%100?" "+t(x%100):"") : x<2000?"seribu"+(x-1000?" "+t(x-1000):"") : x<1e6?t(Math.floor(x/1000))+" ribu"+(x%1000?" "+t(x%1000):"") : x<1e9?t(Math.floor(x/1e6))+" juta"+(x%1e6?" "+t(x%1e6):"") : t(Math.floor(x/1e9))+" miliar"+(x%1e9?" "+t(x%1e9):"");
  const r=n===0?"nol":t(n); return (r.charAt(0).toUpperCase()+r.slice(1))+" rupiah"; }

function barSVG(items){
  const W=520,H=240,pl=34,pr=8,pt=10,pb=28, n=Math.max(1,items.length), max=niceMax(Math.max(1,...items.map(i=>i.v)));

}
function lineSVG(vals, labels){
  const W=680,H=260,pl=46,pr=12,pt=12,pb=28, n=vals.length, max=niceMax(Math.max(1,...vals));
  const ih=H-pt-pb, iw=W-pl-pr, X=i=>pl+(n>1?iw*i/(n-1):iw/2), Y=v=>pt+ih-ih*v/max;
  let g=`<defs><linearGradient id="gArea" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:var(--accent);stop-opacity:.32"/><stop offset="1" style="stop-color:var(--accent);stop-opacity:0"/></linearGradient></defs>`;
  for(let k=0;k<=5;k++){ const y=pt+ih-ih*k/5; g+=`<line class="gl" x1="${pl}" x2="${W-pr}" y1="${y}" y2="${y}"/><text class="ax" x="${pl-8}" y="${y+4}" text-anchor="end">${k?shortRp(max*k/5):"0"}</text>`; }
  const P=vals.map((v,i)=>[X(i),Y(v)]);
  let d=`M${P[0][0]},${P[0][1]}`;
  for(let i=0;i<P.length-1;i++){ const p0=P[i-1]||P[i], p1=P[i], p2=P[i+1], p3=P[i+2]||p2; const c1=[p1[0]+(p2[0]-p0[0])/6, p1[1]+(p2[1]-p0[1])/6], c2=[p2[0]-(p3[0]-p1[0])/6, p2[1]-(p3[1]-p1[1])/6];

  g+=`<path d="${d} L${P[P.length-1][0]},${pt+ih} L${P[0][0]},${pt+ih} Z" fill="url(#gArea)"/><path d="${d}" fill="none" style="stroke:var(--accent)" stroke-width="2.4" stroke-linecap="round"/>`;
  const every=Math.ceil(n/10);
  labels.forEach((l,i)=>{ if(i%every===0||i===n-1) g+=`<text class="ax" x="${X(i)}" y="${H-8}" text-anchor="middle">${l}</text>`; });
  P.forEach(([x,y],i)=>{ g+=`<circle class="hit" cx="${x}" cy="${y}" r="9" fill="transparent"><title>${labels[i]}: ${rp(vals[i])}</title></circle><circle class="pt" cx="${x}" cy="${y}" r="4"/>`; });

}

function vJadwal(){
  const day=ui.jHari, t=todayISO(), PX=1.5;
  const [o,c]=jamBuka(day), O=toMin(o), C=toMin(c), H=(C-O)*PX;
  const all=state.jadwal.filter(j=>j.hari===day && (!ui.jIns || (slotIns(j)||{}).id===ui.jIns));
  const counts=HARI.map(h=>state.jadwal.filter(j=>j.hari===h).length);
  const insOpt=[...state.instruktur].sort(byText(i=>i.nama)).map(i=>`<option value="${i.id}" ${ui.jIns===i.id?"selected":""}>${esc(i.nama)}</option>`).join("");
  const lama=state.jadwal.filter(j=>!DURASI.includes(durOf(j))).length;
  const luar=all.filter(outOfHours);
  const luarIns=new Set(all.filter(luarTanpaKet).map(j=>j.id));
  const fIns=ui.jIns&&insOf(ui.jIns), fT=fIns&&tersediaOf(fIns.id);
  const bentrok=new Set(); RUANG.forEach(r=>{ const xs=all.filter(j=>j.ruang===r); xs.forEach((a,i)=>xs.slice(i+1).forEach(b=>{ if(overlap(a,b)){ bentrok.add(a.id); bentrok.add(b.id); } })); });
  const ticks=[]; for(let m=Math.ceil(O/60)*60; m<=C; m+=60) ticks.push(m);
  const now=new Date(); const nowM=now.getHours()*60+now.getMinutes();
  const col=r=>`<div class="tl-col" data-tlr="${r}" style="height:${H}px;--h:${60*PX}px;background-position:0 ${((Math.ceil(O/60)*60-O)*PX)}px" aria-label="Ruang ${r}, ketuk area kosong untuk menambah sesi">

      ${all.filter(j=>j.ruang===r).map(j=>{ const s=byId("siswa",j.siswaId), p=progOf(s), ins=slotIns(j); const top=Math.max(0,(toMin(j.mulai)-O)*PX), hgt=Math.max(22,durOf(j)*PX-3); const d=durOf(j);
        return `<button type="button" class="tl-s ${s?"":"unlinked"} ${bentrok.has(j.id)||outOfHours(j)||luarIns.has(j.id)?"warn":""}" style="top:${top}px;height:${hgt}px;--c:${s?colorOf(p):"var(--muted)"}" data-edit-jadwal="${j.id}" title="${esc(j.mulai)}–${esc(j.selesai)} · ${esc(slotName(j))}${luarIns.has(j.id)?" · "+esc(availCheck(ins.id,j.hari,j.mulai,j.selesai)):""}${alasanText(j)?" · "+esc(alasanText(j)):""}"><span class="d">${d}′</span><b>${alasanText(j)?`<i class="ktag">${esc(j.alasan.jenis)}</i>`:""}${esc(slotName(j))}</b><span>${esc(j.mulai)}–${esc(j.selesai)}${s?" · "+esc(kelasLabel(s)):""}${ins?" · "+esc(ins.nama):""}</span></button>`; }).join("")}
    </div>`;
  return header("Jadwal ruang","Jadwal mingguan",`Sesi 30, 45, atau 60 menit · ${day==="Minggu"?"Minggu 08.40–18.40":"Senin–Sabtu 10.00–20.00"} · Ruang ${RUANG[0]}–${RUANG[RUANG.length-1]} · ${state.jadwal.length} sesi per minggu`,
     `<select id="jIns" aria-label="Filter instruktur"><option value="">Semua instruktur</option>${insOpt}</select><button class="btn primary" data-new-sesi="1">+ Tambah sesi</button>`)

  <section class="panel"><div class="panel-h"><div><h2>${day}</h2><span class="sub">Jam operasional ${o.replace(":",".")}–${c.replace(":",".")} · ketuk area kosong untuk menambah sesi${bentrok.size?` · <span style="color:var(--bad)">${bentrok.size} sesi bentrok</span>`:""}${luarIns.size?` · <span style="color:var(--bad)">${luarIns.size} sesi di luar jam mengajar instruktur</span>`:""}${fIns?` · ${esc(fIns.nama)}: ${fT?(fT[day]&&fT[day].mulai?`mengajar ${jm(fT[day].mulai)}–${jm(fT[day].selesai)}`:"tidak mengajar hari ini"):"jam mengajar belum diatur"}`:""}</span></div><div class="legend">${state.program.filter(p=>p.nama!=="Ansambel").map(p=>`<span><i class="sw" style="background:${colorOf(p)}"></i>${esc(p.nama)}</span>`).join("")}<span><i class="sw" style="background:var(--muted)"></i>Belum terhubung</span></div></div>

      const E=absEntry(tgl,j.id);

function vTagihan(){

  const total=list.reduce((a,b)=>a+(+b.jumlah||0),0), masuk=list.reduce((a,b)=>a+paidOf(b),0);

  if(q) list=list.filter(x=>((byId("siswa",x.siswaId)||{}).nama||"").toLowerCase().includes(q));
  list.sort(byText(x=>(byId("siswa",x.siswaId)||{}).nama));
  const tanpa=state.siswa.filter(s=>s.status==="aktif"&&!state.tagihan.some(x=>x.siswaId===s.id&&x.bulan===m)).length;
  const pct=total?Math.round(masuk/total*100):0;
  return header("Keuangan","SPP & tagihan",fmtMonth(m)+" · bayar paling lambat tanggal 10",`<input type="month" id="tagBulan" value="${m}" aria-label="Bulan"><button class="btn" data-act="add-tagihan">+ Tagihan lain</button><button class="btn primary" data-gen="1" ${tanpa?"":"disabled"}>Buat SPP ${BULAN[+m.split("-")[1]-1]}${tanpa?" ("+tanpa+")":""}</button>`)

      <div class="stat hl"><span class="v num">${rp(total-masuk)}</span><span class="l">Belum dibayar</span></div>

    </div>

    ${list.length?`<div class="table-wrap"><table><thead><tr><th>Siswa</th><th class="hide-sm">Keterangan</th><th class="r">Jumlah</th><th>Status</th><th></th></tr></thead><tbody>${list.map(x=>{const s=byId("siswa",x.siswaId);const ins=s&&insOf(s.instrukturId);
      return `<tr><td><b>${esc(s?s.nama:"Siswa terhapus")}</b><div class="sub">${s?esc(kelasLabel(s)):""}${ins?" · "+esc(ins.nama):""}</div></td><td class="hide-sm">${esc(x.ket||"SPP "+fmtMonth(x.bulan))}</td><td class="r num">${rp(x.jumlah)}${x.status==="sebagian"?`<div class="sub">dibayar ${rp(paidOf(x))}</div>`:""}</td><td>${billPill(x)}${paidOf(x)&&x.tglBayar?`<div class="sub">${fmtDate(x.tglBayar)}${x.metode?" · "+esc(x.metode):""}</div>`:""}</td><td class="r" style="white-space:nowrap">${x.status!=="lunas"?`<button class="btn small" data-bayar="${x.id}">Bayar</button>`:""}${paidOf(x)?`<button class="btn small ghost" data-kw="${x.id}">Kwitansi</button>`:`<button class="btn small ghost" data-inv="${x.id}">Invoice</button>`}<button class="btn small ghost" data-edit-tagihan="${x.id}" aria-label="Ubah tagihan">Ubah</button></td></tr>`}).join("")}</tbody></table></div>`
    :`<div class="empty"><strong>${state.tagihan.some(x=>x.bulan===m)?"Tidak ada yang cocok":"Belum ada tagihan "+fmtMonth(m)}</strong><span>Tekan “Buat SPP” untuk menagih semua siswa aktif sesuai tarif di data siswa.</span></div>`}
    </section>`;
}

function groupsFor(m){
  const g={};
  state.tagihan.filter(x=>x.bulan===m).forEach(x=>{ const s=byId("siswa",x.siswaId); const k=s?personKey(s):"x-"+x.siswaId; (g[k]=g[k]||{key:k,siswa:s,items:[]}).items.push(x); });
  return Object.values(g).map(G=>{ G.total=G.items.reduce((a,b)=>a+(+b.jumlah||0),0); G.paid=G.items.reduce((a,b)=>a+paidOf(b),0); G.sisa=G.total-G.paid; G.status=G.sisa<=0?"lunas":G.paid>0?"sebagian":"belum"; return G; });
}

/* ---------- catatan instruktur ---------- */
const LEVEL = [["1","Perlu bimbingan"],["2","Berkembang"],["3","Baik"],["4","Sangat baik"]];
const levelLabel = v => (LEVEL.find(l=>l[0]===String(v))||[])[1]||"";
const levelBadge = v => v ? `<span class="lv" title="Perkembangan">${esc(levelLabel(v))}<i>${[1,2,3,4].map(n=>`<b class="${n<=+v?"on":""}"></b>`).join("")}</i></span>` : "";
const isBulanan = n => !!(n&&n.jenis==="bulanan");
const notesOf = sid => state.catatan.filter(n=>!isBulanan(n)&&n.siswaId===sid).sort(byText(n=>n.tanggal+(n.dibuat||""))).reverse();
const daysSince = iso => iso ? Math.floor((new Date(todayISO()+"T00:00:00")-new Date(iso+"T00:00:00"))/864e5) : null;
function catatanText(n){
  const s=byId("siswa",n.siswaId), ins=insOf(n.instrukturId);
  const part=(t,v)=>v?`\n\n*${t}*\n${v}`:"";
  return `*Catatan les ${s?s.nama:"siswa"}*\n${s?kelasLabel(s)+" · ":""}${dayName(n.tanggal)}, ${fmtDate(n.tanggal)}${ins?"\nInstruktur: "+ins.nama:""}`
    + part("Materi yang dipelajari",n.materi)
    + (n.level?`\n\n*Perkembangan:* ${levelLabel(n.level)}`:"")
    + part("Catatan untuk siswa & orang tua",n.catatan)
    + part("Latihan di rumah",n.latihan)
    + `\n\n— ${lembaga().nama}`;
}

    ${(n.materi||n.catatan||n.latihan)?`<div class="nt-body">${blk("Materi",n.materi)}${blk("Catatan",n.catatan)}${blk("Latihan di rumah",n.latihan)}</div>`:""}

function vCatatan(){
  const q=ui.nCari.toLowerCase().trim();
  const insOpt=[...state.instruktur].filter(i=>i.status!=="nonaktif"||i.id===ui.nIns).sort(byText(i=>i.nama)).map(i=>`<option value="${i.id}" ${ui.nIns===i.id?"selected":""}>${esc(i.nama)}</option>`).join("");
  const harian=state.catatan.filter(n=>!isBulanan(n));
  const months=[...new Set([thisMonth(),...harian.map(n=>(n.tanggal||"").slice(0,7)).filter(Boolean)])].sort().reverse();
  let list=harian.filter(n=>{ const s=byId("siswa",n.siswaId);
    return (!ui.nIns||n.instrukturId===ui.nIns) && (!ui.nBulan||(n.tanggal||"").startsWith(ui.nBulan)) && (!q||((s?s.nama:"")+" "+(n.materi||"")+" "+(n.catatan||"")).toLowerCase().includes(q)); });
  list.sort(byText(n=>n.tanggal+(n.dibuat||""))).reverse();
  const bulanIni=harian.filter(n=>(n.tanggal||"").startsWith(thisMonth())).length;
  let roster="";
  if(ui.nIns){
    const ins=insOf(ui.nIns);
    const ss=state.siswa.filter(s=>s.instrukturId===ui.nIns&&s.status==="aktif").sort(byText(s=>s.nama));
    const row=s=>{ const last=notesOf(s.id)[0]; const d=last?daysSince(last.tanggal):null; const p=progOf(s), c=colorOf(p);
      return `<div class="rs"><span class="av" style="background:color-mix(in srgb, ${c} 16%, transparent);color:${c}">${esc(initials(s.nama))}</span><div><b>${esc(s.nama)}</b><span class="sub ${d===null||d>14?"due":""}">${esc(kelasLabel(s))} · ${last?(d===0?"dicatat hari ini":"terakhir "+fmtDate(last.tanggal)):"belum ada catatan"}</span></div><button class="btn small" data-nnew="${s.id}" aria-label="Tulis catatan untuk ${esc(s.nama)}">+ Catat</button></div>`; };
    roster=`<section class="panel"><div class="panel-h"><h2>Murid ${esc(ins?ins.nama:"")}</h2><span class="note num">${ss.length} murid aktif · <span style="color:var(--warn)">jingga</span> = belum dicatat 2 minggu</span></div>${ss.length?`<div class="roster">${ss.map(row).join("")}</div>`:`<div class="empty">Instruktur ini belum punya murid aktif.</div>`}</section>`;
  }
  return header("Perkembangan siswa","Catatan instruktur",`${state.catatan.length} catatan · ${bulanIni} bulan ini. Pilih instruktur untuk melihat daftar muridnya.`,`<button class="btn primary" data-act="add-catatan">+ Tulis catatan</button>`)
  + modeBanner()
  + `<div class="toolbar"><select id="nIns" aria-label="Instruktur"><option value="">Semua instruktur</option>${insOpt}</select>
     <select id="nBulan" aria-label="Bulan"><option value="">Semua bulan</option>${months.map(m=>`<option value="${m}" ${ui.nBulan===m?"selected":""}>${fmtMonth(m)}</option>`).join("")}</select>
     <input type="search" id="nCari" placeholder="Cari nama atau isi catatan" value="${esc(ui.nCari)}" aria-label="Cari catatan"></div>`
  + roster
  + `<section class="panel"><div class="panel-h"><h2>Riwayat catatan</h2><span class="note num">${list.length} catatan</span></div>
    ${!loaded.catatan?`<div class="empty">Memuat…</div>`:list.length?`<div class="nt-list">${list.slice(0,100).map(n=>noteCard(n)).join("")}</div>${list.length>100?`<div class="panel-b note">Menampilkan 100 terbaru. Persempit dengan filter bulan atau instruktur.</div>`:""}`
    :`<div class="empty"><strong>${state.catatan.length?"Tidak ada yang cocok":"Belum ada catatan"}</strong><span>${state.catatan.length?"Ubah filter atau kata kunci.":"Setelah les, instruktur menulis materi, perkembangan, dan latihan di rumah untuk tiap murid."}</span></div>`}
  </section>`;
}

/* ---------- ketersediaan ---------- */
function insFreeWindows(id, hari){
  const t=tersediaOf(id); const [o,c]=jamBuka(hari);
  let lo, hi; if(t){ if(!(t[hari]&&t[hari].mulai)) return []; lo=Math.max(toMin(t[hari].mulai),toMin(o)); hi=Math.min(toMin(t[hari].selesai),toMin(c)); } else { lo=toMin(o); hi=toMin(c); }
  const busy=state.jadwal.filter(x=>x.hari===hari&&(slotIns(x)||{}).id===id).map(x=>[toMin(x.mulai),toMin(x.selesai)]).sort((a,b)=>a[0]-b[0]);
  const out=[]; let cur=lo; busy.forEach(([a,b])=>{ if(a>cur) out.push([cur,Math.min(a,hi)]); cur=Math.max(cur,b); }); if(cur<hi) out.push([cur,hi]);
  return out.filter(([a,b])=>b-a>=30);
}
// Ketersediaan mingguan satu instruktur: jam mengajar, sesi terisi, dan jam kosong per hari
function insAvailWeek(id, interactive){
  const i=insOf(id); if(!i) return `<div class="empty">Pilih instruktur</div>`;
  const t=tersediaOf(id); let totAv=0, totBz=0, totFree=0;
  const days=HARI.map(h=>{
    const [o,c]=jamBuka(h), O=toMin(o), C=toMin(c), span=C-O;
    const r=t?(t[h]&&t[h].mulai?t[h]:null):{mulai:o,selesai:c};
    const ses=state.jadwal.filter(x=>x.hari===h&&(slotIns(x)||{}).id===id).sort(byText(x=>x.mulai));
    const wins=r?insFreeWindows(id,h):[];
    const av=r?toMin(r.selesai)-toMin(r.mulai):0, bz=ses.reduce((a,x)=>a+durOf(x),0), fr=wins.reduce((a,[x,y])=>a+(y-x),0);
    if(r){ totAv+=av; totFree+=fr; } totBz+=bz;
    if(!r&&!ses.length) return {h,html:""};
    const pct=m=>((m-O)/span*100).toFixed(2);
    const bar=`<div class="aw-bar" aria-hidden="true">${r?`<i class="avl" style="left:${pct(toMin(r.mulai))}%;width:${(pct(toMin(r.selesai))-pct(toMin(r.mulai))).toFixed(2)}%"></i>`:""}${ses.map(x=>`<i class="bz ${availCheck(id,x.hari,x.mulai,x.selesai)&&!alasanText(x)?"x":""}" style="left:${pct(toMin(x.mulai))}%;width:${(durOf(x)/span*100).toFixed(2)}%" title="${esc(x.mulai)}–${esc(x.selesai)} ${esc(slotName(x))}"></i>`).join("")}</div>`;
    const sesHtml=ses.length?ses.map(x=>{ const s=byId("siswa",x.siswaId); const out=availCheck(id,x.hari,x.mulai,x.selesai); return `<span class="aw-chip" ${out&&!alasanText(x)?'style="border-color:var(--bad)"':""}>${jm(x.mulai)}–${jm(x.selesai)} · ${esc(slotName(x).split(" ").slice(0,2).join(" "))}${s?" ("+esc(progOf(s)?progOf(s).nama:kelasLabel(s))+")":""} · R.${esc(x.ruang)}${alasanText(x)?` <i class="ktag">${esc(x.alasan.jenis)}</i>`:""}</span>`; }).join(""):`<span class="sub">Belum ada sesi</span>`;
    const freeHtml=r?(wins.length?wins.map(([a,b])=>{ const lbl=`${jm(toHM(a))}–${jm(toHM(b))} <span style="opacity:.75">(${b-a}′)</span>`; return interactive?`<button type="button" class="aw-chip free" data-kpick="${h}|${toHM(a)}" data-kpickins="${id}" title="Cek ruang kosong di jam ini">${lbl}</button>`:`<span class="aw-chip free">${lbl}</span>`; }).join(""):`<span class="sub">Penuh</span>`):`<span class="sub" style="color:var(--bad)">Tidak ada jam mengajar hari ini</span>`;
    return {h,html:`<div class="aw-day"><h4>${h}<small>${r?`${jm(r.mulai)}–${jm(r.selesai)}`:"Libur"}</small></h4><div>${bar}<div class="aw-row"><span class="lbl">Terisi</span>${sesHtml}</div><div class="aw-row" style="margin-top:6px"><span class="lbl">Kosong</span>${freeHtml}</div></div></div>`};
  });
  const jam=m=>{ const h=Math.floor(m/60), mm=m%60; return h+(mm?`j ${mm}m`:" jam"); };
  const pct=totAv?Math.round(Math.min(totBz,totAv)/totAv*100):0;
  return `<div class="aw-sum"><div><b>${jam(totAv)}</b><span>${t?"Jam mengajar / minggu":"Jam operasional (belum diatur)"}</span></div><div><b>${jam(totBz)}</b><span>Terisi · ${state.jadwal.filter(x=>(slotIns(x)||{}).id===id).length} sesi</span></div><div><b style="color:var(--good)">${jam(totFree)}</b><span>Masih kosong</span></div><div><b>${pct}%</b><span>Keterisian</span></div></div>
    <div class="aw-legend"><span><i style="background:color-mix(in srgb,var(--good) 22%,transparent)"></i>Jam mengajar</span><span><i style="background:var(--accent)"></i>Sesi terisi</span><span><i style="background:var(--bad)"></i>Di luar jam mengajar</span><span>Jam kosong minimal 30 menit</span></div>
    ${days.map(d=>d.html).join("")||`<div class="empty">Belum ada jam mengajar maupun sesi</div>`}`;
}

function formAvail(i){

      for(const h of HARI){ if(!f.get("on_"+h)) continue; const m=f.get("m_"+h), s=f.get("s_"+h); const [o,c]=jamBuka(h);

        if(toMin(s)-toMin(m)<30) return `Jam selesai hari ${h} harus setidaknya 30 menit setelah jam mulai.`;
        if(toMin(m)<toMin(o)||toMin(s)>toMin(c)) return `Jam hari ${h} di luar jam operasional (${jm(o)}–${jm(c)}).`;
        tersedia[h]={mulai:m,selesai:s}; }
      const next={...i,tersedia}; 
      return Store.put("instruktur",next).then(()=>{ const n=state.jadwal.filter(j=>(slotIns(j)||{}).id===i.id&&availCheck(i.id,j.hari,j.mulai,j.selesai)).length; toast(n?`Disimpan. ${n} sesi ${i.nama} di luar jam mengajar, cek di menu Ketersediaan.`:"Jam mengajar disimpan"); }); });

function buildDoc(kind, key, m){
  const G=groupsFor(m).find(g=>g.key===key); if(!G) return null;
  const s=G.siswa||{}; const L=lembaga(); const multi=G.items.length>1;
  const items=(kind==="kwitansi"?G.items.filter(x=>paidOf(x)>0):G.items).map(x=>({ket:itemLabel(x,multi)+(kind==="kwitansi"&&x.status==="sebagian"?" (sebagian)":""),qty:1,harga:kind==="kwitansi"?paidOf(x):+x.jumlah||0,x}));
  const total=items.reduce((a,b)=>a+b.harga,0);
  const pays=G.items.filter(x=>paidOf(x)>0).sort(byText(x=>x.tglBayar));
  const lastPay=pays.length?pays[pays.length-1]:null;
  const progs=[...new Set(G.items.map(x=>{const ss=byId("siswa",x.siswaId);return ss?kelasLabel(ss):""}).filter(Boolean))];
  const digits=(s.noInduk||"").replace(/\D/g,"").slice(-5)||"00000"; const ym=m.replace("-","").slice(2);
  const now=new Date(); const gen=pad(now.getDate())+"/"+pad(now.getMonth()+1)+"/"+now.getFullYear()+" "+pad(now.getHours())+":"+pad(now.getMinutes());
  return {kind, L, s, items, total, sisa:G.sisa, status:G.status, progs, m,
    no:(kind==="invoice"?"INV":"KW")+"/SRMC/"+ym+"/"+digits,
    tanggal: kind==="kwitansi"&&lastPay&&lastPay.tglBayar ? lastPay.tglBayar : todayISO(),
    jatuhTempo: m+"-"+pad(L.jatuhTempo), metode: lastPay&&lastPay.metode||"", gen};
}

function waNumber(wali){
  const first=String(wali||"").split("/")[0]; if(/\?/.test(first)) return "";
  let d=first.replace(/\([^)]*\)/g,"").replace(/[^\d+]/g,"");
  if(d.startsWith("+")) d=d.slice(1); else if(d.startsWith("0")) d="62"+d.slice(1); else if(d.startsWith("8")) d="62"+d;
  return d.length>=10&&d.length<=15 ? d : "";
}
function waText(D){
  const head=D.kind==="invoice" ? `Assalamu'alaikum, Bapak/Ibu orang tua ${D.s.nama||""}. Berikut invoice les bulan ${fmtMonth(D.m)} dari ${D.L.nama}.\n\n` : `Terima kasih, Bapak/Ibu. Pembayaran untuk ${D.s.nama||""} sudah kami terima.\n\n`;
  const tail=D.kind==="invoice" ? "\nMohon kirim bukti transfer dengan membalas pesan ini. Terima kasih." : "";
  return head+docText(D)+tail;
}
function waHref(D){ const n=waNumber(D.s.wali); return n ? "https://wa.me/"+n+"?text="+encodeURIComponent(waText(D)) : ""; }
const sentField = kind => kind==="invoice" ? "waInvoiceAt" : "waKwitansiAt";

  return jsPDFp; }
function pdfOf(D, jsPDF){
  const doc=new jsPDF({unit:"mm",format:"a5"}); const W=148, M=12; let y=14; const L=D.L, inv=D.kind==="invoice";
  const ink=[22,54,46], mute=[95,112,104], red=[178,59,51], green=[47,125,79];

  const cols=[M,M+24,M+78,M+106];
